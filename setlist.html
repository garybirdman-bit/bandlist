<style>
:root{
  --or:#D4793F;--or-dim:rgba(212,121,63,0.15);
  --bg:#1a1a1f;--s1:#22222a;--s2:#2a2a34;--s3:#32323e;
  --br:#32323e;--tx:#f0ece4;--tx2:#d0ccc4;--mu:#b0aaa4;--mu2:#707070;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Montserrat',sans-serif;font-weight:300;}
body{display:flex;flex-direction:column;height:100vh;font-family:'Golos Text',sans-serif;}

/* HEADER */
.hdr{padding:20px 20px 0;flex-shrink:0;background:var(--bg);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.logo{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:7px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:10px;}
.add-btn{width:34px;height:34px;background:var(--or);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 12px rgba(212,121,63,0.3);}
.more-btn{width:34px;height:34px;background:var(--s1);border:1px solid var(--br);border-radius:50%;color:var(--tx2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* NAV TABS (Сетлист / Репертуар) */
.nav-tabs{display:flex;gap:0;border-bottom:1px solid var(--br);margin-bottom:0;flex-shrink:0;}
.nav-tab{flex:1;background:none;border:none;color:var(--mu);font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.nav-tab.on{color:var(--or);border-bottom-color:var(--or);}

/* CONCERT TABS */
.ctabs{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:10px 20px 10px;scrollbar-width:none;background:var(--bg);}
.ctabs::-webkit-scrollbar{display:none;}
.ctab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:1px;cursor:pointer;border:1px solid var(--s3);background:var(--s1);color:var(--tx2);transition:all .2s;white-space:nowrap;}
.ctab.on{background:var(--or);border-color:var(--or);color:#fff;font-weight:500;}
.ctab input{background:none;border:none;outline:none;color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:1px;width:90px;padding:0;}
.cadd{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px dashed var(--s3);background:var(--s1);color:var(--tx2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* SEARCH */
.search-wrap{padding:8px 12px;background:var(--bg);flex-shrink:0;}
.search-inner{position:relative;}
.search-inp{width:100%;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:9px 14px 9px 36px;font-size:13px;font-family:'Montserrat',sans-serif;font-weight:300;outline:none;}
.search-inp:focus{border-color:var(--or);}
.search-inp::placeholder{color:var(--mu2);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}

.divl{height:1px;background:var(--br);flex-shrink:0;}

/* LIST */
.lw{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--bg);padding-top:4px;padding-bottom:80px;}
.lw::-webkit-scrollbar{display:none;}

/* SECTIONS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;}
.sec-name{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--tx2);font-weight:500;}
.sec-acts{display:flex;gap:2px;}
.sec-btn{background:none;border:none;color:var(--tx2);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:4px;opacity:.8;}
.sec-btn.red{color:#e05252;}
.add-sec-row{padding:8px 12px 20px;}
.add-sec-btn{width:100%;padding:10px;border:1px dashed var(--s3);border-radius:12px;background:var(--s1);color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}

/* SONG ROWS */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;position:relative;margin:0 12px 6px;background:var(--s1);border-radius:14px;}
.row.dragging{opacity:.3;}
.row.dover{background:var(--s2);border:1px solid var(--or);}
.dh{display:flex;flex-direction:column;gap:4px;cursor:grab;padding:4px 2px;flex-shrink:0;touch-action:none;}
.dh span{display:block;width:14px;height:1.5px;background:var(--mu2);border-radius:2px;}
.snum{font-family:'Golos Text',sans-serif;font-size:13px;color:var(--mu);width:16px;text-align:center;flex-shrink:0;}
.si{flex:1;min-width:0;cursor:pointer;}
.st{font-family:'Golos Text',sans-serif;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;letter-spacing:-.2px;}
.ss{font-size:10px;color:#888;margin-top:3px;letter-spacing:.5px;text-transform:uppercase;font-family:'Golos Text',sans-serif;}
.sk{font-family:'Golos Text',sans-serif;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;width:28px;text-align:center;}
.sdel{background:none;border:none;color:var(--tx2);font-size:12px;cursor:pointer;padding:4px;flex-shrink:0;}
.sdel:hover{color:#e05252;}

/* STATUS BADGE */
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;}
.status-ready{background:#2a9d8f;}
.status-learning{background:#D4793F;}

.status-idea{background:#9b8ea8;}

/* REPERTOIRE */
.rep-row{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:0 12px 6px;background:var(--s1);border-radius:14px;cursor:pointer;}
.rep-row.dover{background:var(--s2);border:1px solid var(--or);}
.rep-row.dragging{opacity:.3;}
.rep-row:hover{background:var(--s2);}
.rep-info{flex:1;min-width:0;}
.rep-title{font-family:'Golos Text',sans-serif;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;letter-spacing:-.2px;}
.rep-sub{font-size:10px;color:#888;margin-top:3px;letter-spacing:.5px;text-transform:uppercase;font-family:'Golos Text',sans-serif;}
.rep-key{font-family:'Golos Text',sans-serif;font-size:16px;font-weight:600;color:#fff;flex-shrink:0;width:32px;text-align:center;}
.rep-actions{display:flex;gap:6px;flex-shrink:0;}
.rep-add-btn{background:transparent;border:1px solid rgba(212,121,63,0.6);border-radius:8px;color:var(--or);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:1px;padding:5px 12px;cursor:pointer;transition:all .2s;}
.rep-del{background:none;border:none;color:var(--mu2);font-size:12px;cursor:pointer;padding:4px;}
.rep-dh{display:flex;flex-direction:column;gap:4px;cursor:grab;padding:4px 2px;flex-shrink:0;touch-action:none;}
.rep-dh span{display:block;width:14px;height:1.5px;background:var(--mu2);border-radius:2px;}
.rep-del:hover{color:#e05252;}
.status-filter{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.status-filter::-webkit-scrollbar{display:none;}
.sf-btn{flex-shrink:0;padding:5px 14px;border-radius:20px;font-size:12px;font-family:'Golos Text',sans-serif;font-weight:600;letter-spacing:1px;cursor:pointer;border:1px solid var(--s3);background:var(--s1);color:var(--tx2);transition:all .2s;white-space:nowrap;}
.sf-btn.on{border-color:var(--or);color:var(--or);background:var(--or-dim);}

/* SLIDE PANEL */
.panel{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.panel.open{transform:translateY(0);}
.ph{padding:20px 16px 0;flex-shrink:0;background:var(--bg);}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;}
.pa{font-size:10px;color:var(--or);letter-spacing:3px;text-transform:uppercase;margin-bottom:5px;}
.pt{font-family:'Golos Text',sans-serif;font-size:20px;font-weight:400;line-height:1.1;color:var(--tx);}
.pcl{background:var(--s2);border:none;color:var(--tx2);border-radius:50%;width:32px;height:32px;font-size:13px;cursor:pointer;flex-shrink:0;}
.ptabs{display:flex;margin-top:14px;border-bottom:1px solid var(--br);overflow-x:auto;scrollbar-width:none;}
.ptabs::-webkit-scrollbar{display:none;}
.ptab{background:none;border:none;color:var(--mu);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.ptab.on{color:var(--or);border-bottom-color:var(--or);}

/* CONTROLS */
.ctrls{display:flex;gap:8px;padding:12px 12px;border-bottom:1px solid var(--br);flex-shrink:0;background:var(--bg);}
.cb{flex:1;background:var(--s2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;}
.cl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);font-weight:400;}
.cr{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.cv{font-family:'Golos Text',sans-serif;font-size:20px;font-weight:600;min-width:40px;text-align:center;color:var(--tx);}
.cv.or{color:#fff !important;font-size:24px;}
.cbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--br);background:var(--s3);color:var(--tx);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cbtn:active{background:var(--br);}
.tapbtn{height:26px;border-radius:8px;border:1px solid var(--or);background:transparent;color:var(--or);font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:100%;font-weight:500;}
.tapbtn:active{background:var(--or);color:#fff;}

/* PANEL BODY */
.pb{flex:1;overflow-y:auto;padding:14px 12px 50px;scrollbar-width:none;background:var(--bg);}
.pb::-webkit-scrollbar{display:none;}

/* FORM TAB */
.fr{display:flex;align-items:center;gap:6px;padding:10px 10px;margin-bottom:6px;background:var(--s1);border-radius:12px;}
.fi2{font-family:'Golos Text',sans-serif;font-size:12px;color:var(--or);width:14px;text-align:center;flex-shrink:0;}
.fn-inp{background:none;border:none;border-bottom:1px solid var(--br);color:var(--tx);font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;outline:none;flex:1;padding:2px 0;min-width:0;}
.fn-inp:focus{border-bottom-color:var(--or);}
.ftbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--br);background:var(--s2);color:var(--tx2);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ftval{font-family:'Golos Text',sans-serif;font-size:17px;color:var(--tx);min-width:26px;text-align:center;flex-shrink:0;font-weight:600;}
.form-add-btn{width:100%;padding:14px;border:1px dashed var(--or);border-radius:12px;background:var(--or-dim);color:var(--or);font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px;font-weight:500;}

/* LYRICS */
.lyr{font-size:14px;line-height:2;font-weight:300;color:var(--tx2);}
.lhd{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--or);margin-top:20px;margin-bottom:5px;}
.lhd:first-child{margin-top:0;}

/* CHORDS + NOTES */
.ta{width:100%;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:12px;font-size:14px;font-family:'Courier New',monospace;outline:none;resize:none;min-height:160px;line-height:1.9;}
.ta.notes{font-family:'Montserrat',sans-serif;font-weight:300;font-size:13px;line-height:1.8;}
.ta:focus{border-color:var(--or);}
.ta-hint{font-size:10px;color:var(--tx2);letter-spacing:1px;margin-bottom:8px;}
.chord-sec{margin-bottom:8px;background:var(--s1);border-radius:12px;overflow:hidden;}
.chord-sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;}
.chord-sec-name{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:8px;letter-spacing:.3px;}
.chord-sec-del{background:none;border:none;color:var(--mu2);font-size:12px;cursor:pointer;padding:2px 6px;}
.chord-sec-ta{background:none;border:none;border-top:1px solid var(--br);color:var(--tx);padding:10px 14px;font-size:15px;font-family:'Courier New',monospace;outline:none;resize:none;min-height:44px;line-height:1.7;width:100%;}
.chord-sec-ta:focus{background:var(--s2);}
.chord-add-btn{width:100%;padding:11px;border:1px dashed var(--s3);border-radius:12px;background:transparent;color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:4px;}
/* section type picker */
.sec-type-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.sec-type-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--br);background:var(--s1);color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;}
.sec-type-btn:hover{border-color:var(--or);color:var(--or);}

/* PLAYER */
.player-wrap{background:var(--s2);border-radius:14px;padding:12px 14px;margin-bottom:0;}
.player-controls{display:flex;align-items:center;gap:12px;}
.player-playbtn{width:42px;height:42px;border-radius:50%;background:var(--or);border:none;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.player-info{flex:1;min-width:0;}
.player-fname{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.player-progress{width:100%;height:3px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative;margin-bottom:6px;}
.player-progress-fill{height:100%;background:var(--or);border-radius:2px;transition:width .1s linear;pointer-events:none;}
.player-times{display:flex;justify-content:space-between;font-size:10px;color:var(--mu2);font-family:'Golos Text',sans-serif;}
.player-del{background:none;border:none;color:var(--mu2);font-size:11px;cursor:pointer;padding:4px;flex-shrink:0;}
.player-vol-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.player-vol-icon{font-size:13px;color:var(--mu2);}
.player-vol{flex:1;height:3px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative;}
.player-vol-fill{height:100%;background:var(--mu2);border-radius:2px;pointer-events:none;}

/* MODAL */
.modal{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.modal.open{transform:translateY(0);}
.mi{flex:1;overflow-y:auto;padding:22px 16px 60px;scrollbar-width:none;}
.mi::-webkit-scrollbar{display:none;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.mt{font-family:'Golos Text',sans-serif;font-size:22px;font-weight:600;letter-spacing:1px;color:var(--tx);}
.fl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:7px;margin-top:18px;font-weight:400;}
.fl:first-child{margin-top:0;}
.fi{width:100%;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:11px 13px;font-size:15px;font-family:'Montserrat',sans-serif;font-weight:300;outline:none;}
.fi:focus{border-color:var(--or);}
select.fi{cursor:pointer;}
textarea.fi{resize:none;min-height:80px;}
textarea.fi.tall{min-height:120px;}
.kg{display:flex;flex-wrap:wrap;gap:6px;}
.kb{border-radius:8px;padding:5px 10px;font-size:13px;font-family:'Golos Text',sans-serif;font-weight:600;cursor:pointer;border:1px solid var(--br);background:var(--s1);color:var(--tx2);}
.kb.on{background:var(--or-dim);border-color:var(--or);color:var(--or);}
.clrs{display:flex;gap:8px;flex-wrap:wrap;}
.cc{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.cc.on{border-color:#fff;transform:scale(1.2);}
.subbtn{width:100%;padding:11px;border:1px solid var(--or);border-radius:10px;background:transparent;color:var(--or);font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:22px;}
.delbtn{width:100%;padding:12px;border:1px solid #e05252;border-radius:12px;background:transparent;color:#e05252;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:10px;}

/* STATUS SELECTOR */
.status-row{display:flex;gap:8px;flex-wrap:wrap;}
.st-btn{padding:7px 14px;border-radius:10px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:500;cursor:pointer;border:1px solid var(--br);background:var(--s1);color:var(--tx2);transition:all .15s;letter-spacing:.5px;}
.st-btn.on-ready{background:rgba(42,157,143,.2);border-color:#2a9d8f;color:#2a9d8f;}
.st-btn.on-learning{background:var(--or-dim);border-color:var(--or);color:var(--or);}

.st-btn.on-idea{background:rgba(155,142,168,.2);border-color:#9b8ea8;color:#9b8ea8;}

/* CTX */
.cxov{position:fixed;inset:0;z-index:49;}
.cxm{position:fixed;background:var(--s2);border:1px solid var(--br);border-radius:14px;overflow:hidden;z-index:50;min-width:180px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:cxi .14s ease;}
@keyframes cxi{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.cxi{display:flex;align-items:center;gap:10px;padding:13px 17px;font-size:13px;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;background:none;color:var(--tx);width:100%;text-align:left;}
.cxi:hover{background:var(--s3);}
.cxi.red{color:#e05252;}
.cxi.off{opacity:.3;cursor:default;pointer-events:none;}
.cxi+.cxi{border-top:1px solid var(--br);}

/* OVERFLOW MENU */
.overflow-menu{position:fixed;right:16px;top:68px;background:var(--s2);border:1px solid var(--br);border-radius:14px;overflow:hidden;z-index:50;min-width:180px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:cxi .14s ease;display:none;}
.overflow-menu.open{display:block;}
.om-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:13px;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;background:none;color:var(--tx);width:100%;text-align:left;}
.om-item:hover{background:var(--s3);}
.om-item+.om-item{border-top:1px solid var(--br);}

/* ADD FROM REPERTOIRE MODAL */
.rep-pick-row{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:6px;background:var(--s1);border-radius:12px;cursor:pointer;}
.rep-pick-row:hover{background:var(--s2);}
.rep-pick-row.picked{border:1px solid var(--or);}
.rpr-info{flex:1;min-width:0;}

function txKey(key,st){
  var minor=key.length>1&&key.endsWith("m");var sc=minor?CHRm:CHR;var idx=sc.indexOf(key);
  if(idx<0){var en={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Dbm":"C#m","Ebm":"D#m","Gbm":"F#m","Abm":"G#m","Bbm":"A#m"};var e=en[key];idx=e?sc.indexOf(e):0;}
  return sc[((idx+st)%12+12)%12];
}
function shiftKey(st){var s=findR(panel.id);if(!s)return;s.key=txKey(s.key,st);save();rPanel();rList();rRep();}
function shiftTempo(d){var s=findR(panel.id);if(!s)return;s.tempo=Math.max(40,Math.min(240,s.tempo+d));save();rPanel();rList();}
function tapTempo(){
  var now=Date.now();taps.push(now);taps=taps.filter(function(t){return now-t<3000;});
  if(taps.length<2)return;
  var sum=0;for(var i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];
  var s=findR(panel.id);if(!s)return;
  s.tempo=Math.max(40,Math.min(240,Math.round(60000/(sum/(taps.length-1)))));
  save();rPanel();rList();
}

function doAddSong(secId,sid,concertId){

/* DRAG */
function setupDrag(row,secId,songId){
  var handle=row.querySelector(".dh");
  var active=false,moved=false,startY=0,curRow=null;
  function allRows(){return Array.from(document.querySelectorAll(".row"));}
  function rowCenter(r){var rc=r.getBoundingClientRect();return rc.top+rc.height/2;}
  function start(y){active=true;moved=false;startY=y;curRow=null;dragState={secId:secId,songId:songId};document.body.style.userSelect="none";row.classList.add("dover");}
  function move(y){
    if(!active)return;if(Math.abs(y-startY)<10)return;
    moved=true;row.classList.add("dragging");row.classList.remove("dover");
    var others=allRows().filter(function(r){return !r.classList.contains("dragging");});
    others.forEach(function(r){r.classList.remove("dover");});
    var best=null,bd=999999;
    others.forEach(function(r){var d=Math.abs(rowCenter(r)-y);if(d<bd){bd=d;best=r;}});
    if(best){best.classList.add("dover");curRow=best;}
  }
  function end(){
    if(!active)return;active=false;
    row.classList.remove("dragging");row.classList.remove("dover");
    allRows().forEach(function(r){r.classList.remove("dover");});
    document.body.style.userSelect="";
    if(moved&&curRow&&curRow!==row){
      var toSecId=+curRow.dataset.secId;var toSongId=+curRow.dataset.songId;
      var fromSec=secs().find(function(s){return s.id===secId;});
      var toSec=secs().find(function(s){return s.id===toSecId;});
      if(fromSec&&toSec){
        var fi=fromSec.songs.indexOf(songId);var ti=toSec.songs.indexOf(toSongId);
        if(fi>-1&&ti>-1){fromSec.songs.splice(fi,1);toSec.songs.splice(ti,0,songId);save();rList();}
      }
    }
    dragState={idx:null,secId:null};curRow=null;
  }
  handle.addEventListener("touchstart",function(e){start(e.touches[0].clientY);e.preventDefault();},{passive:false});
  handle.addEventListener("touchmove",function(e){move(e.touches[0].clientY);e.preventDefault();},{passive:false});
  handle.addEventListener("touchend",function(){end();});
  handle.addEventListener("mousedown",function(e){start(e.clientY);var mm=function(ev){move(ev.clientY);};var mu=function(){end();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);e.preventDefault();});
}

/* PLAYER */
function rPlayer(s){
  var slot=document.getElementById("playerSlot");if(!slot)return;
  slot.innerHTML="";
  var wrap=document.createElement("div");wrap.className="player-wrap";slot.appendChild(wrap);
  if(!s.trackName||!s.trackData){
    var btn=document.createElement("button");
    btn.style.cssText="display:block;width:100%;padding:10px;border:1px dashed var(--s3);border-radius:10px;background:none;color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;";
    btn.textContent=t("loadTrack");
    btn.addEventListener("click",function(e){e.preventDefault();_trackTargetSongId=s.id;document.getElementById("trackFileInput").value="";document.getElementById("trackFileInput").click();});
    wrap.appendChild(btn);
  } else {
    var ctrl=document.createElement("div");ctrl.className="player-controls";
    var pb2=document.createElement("button");pb2.className="player-playbtn";pb2.id="playBtn";pb2.textContent="▶";pb2.addEventListener("click",togglePlay);
    var info=document.createElement("div");info.className="player-info";
    var fname=document.createElement("div");fname.className="player-fname";fname.textContent=s.trackName;
    var prog=document.createElement("div");prog.className="player-progress";prog.id="progBar";
    var fill=document.createElement("div");fill.className="player-progress-fill";fill.id="progFill";fill.style.width="0%";
    prog.appendChild(fill);prog.addEventListener("click",seekAudio);
    var times=document.createElement("div");times.className="player-times";
    var cur=document.createElement("span");cur.id="curTime";cur.textContent="0:00";
    var dur2=document.createElement("span");dur2.id="durTime";dur2.textContent="0:00";
    times.appendChild(cur);times.appendChild(dur2);
    info.appendChild(fname);info.appendChild(prog);info.appendChild(times);
    var del=document.createElement("button");del.className="player-del";del.textContent="✕";del.addEventListener("click",function(){removeTrack(s.id);});
    ctrl.appendChild(pb2);ctrl.appendChild(info);ctrl.appendChild(del);wrap.appendChild(ctrl);
    var vr=document.createElement("div");vr.className="player-vol-row";
    var vi=document.createElement("span");vi.className="player-vol-icon";vi.textContent="♪";
    var vb=document.createElement("div");vb.className="player-vol";vb.id="volBar";
    var vf=document.createElement("div");vf.className="player-vol-fill";vf.id="volFill";vf.style.width=(audioVolume*100)+"%";
    vb.appendChild(vf);vb.addEventListener("click",setVolume);
    vr.appendChild(vi);vr.appendChild(vb);wrap.appendChild(vr);
    initAudio(s);
  }
}
function fmtTime(t){if(isNaN(t))return"0:00";var m=Math.floor(t/60);var s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
function initAudio(s){
  if(audioObj){audioObj.pause();audioObj=null;}
  audioObj=new Audio(s.trackData);audioObj.volume=audioVolume;
  audioObj.ontimeupdate=function(){var pf=document.getElementById("progFill");var ct=document.getElementById("curTime");if(pf&&audioObj.duration)pf.style.width=(audioObj.currentTime/audioObj.duration*100)+"%";if(ct)ct.textContent=fmtTime(audioObj.currentTime);};
  audioObj.onloadedmetadata=function(){var dt=document.getElementById("durTime");if(dt)dt.textContent=fmtTime(audioObj.duration);};
  audioObj.onended=function(){var btn=document.getElementById("playBtn");if(btn)btn.textContent="▶";};
}
function togglePlay(){if(!audioObj)return;var btn=document.getElementById("playBtn");if(audioObj.paused){audioObj.play();if(btn)btn.textContent="⏸";}else{audioObj.pause();if(btn)btn.textContent="▶";}}
function seekAudio(e){if(!audioObj||!audioObj.duration)return;var bar=document.getElementById("progBar");var rect=bar.getBoundingClientRect();audioObj.currentTime=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width))*audioObj.duration;}
function setVolume(e){var bar=document.getElementById("volBar");var rect=bar.getBoundingClientRect();audioVolume=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));if(audioObj)audioObj.volume=audioVolume;var vf=document.getElementById("volFill");if(vf)vf.style.width=(audioVolume*100)+"%";}
function loadTrack(sid,input){
  var file=input.files[0];if(!file)return;
  var s=findR(sid);if(!s)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var mb=(e.target.result.length*0.75/1024/1024).toFixed(1);
    if(parseFloat(mb)>20){if(!confirm("Файл "+mb+" MB. Продолжить?"))return;}
    s.trackData=e.target.result;s.trackName=file.name;
    save();rPlayer(s);
  };
  reader.readAsDataURL(file);
}
function removeTrack(sid){
  var s=findR(sid);if(!s)return;
  if(!confirm("Удалить бэкинг-трек?"))return;
  if(audioObj){audioObj.pause();audioObj=null;}
  delete s.trackData;delete s.trackName;save();rPlayer(s);
}

  document.getElementById("trackFileInput").addEventListener("change",function(){
    if(_trackTargetSongId!==null){loadTrack(_trackTargetSongId,this);_trackTargetSongId=null;}
  });
});
try{ var _sl=localStorage.getItem("bandlist_lang"); if(_sl) LANG=_sl; }catch(e){}
var _lb=document.getElementById("langToggleBtn"); if(_lb) _lb.textContent=LANG==="ru"?"EN":"RU";

var perfFontSz = 22;
var perfScrollOn = false;
var perfScrollTimer = null;

function enterPerfMode(){
  var s = findR(panel.id); if(!s) return;
  var ov = document.getElementById('perfOverlay');
  var body = document.getElementById('perfBody');
  var meta = document.getElementById('perfMeta');
  var keyInfo = document.getElementById('perfKeyInfo');
  meta.textContent = s.title + ' · ' + s.artist;
  keyInfo.textContent = s.key + ' · ' + s.tempo + ' BPM';
  body.innerHTML = '';
  perfFontSz = 22;
  // parse lyrics into sections
  var lines = (s.lyrics || '').split('\n');
  var currentSection = null;
  lines.forEach(function(line){
    if(line.startsWith('[')){
      currentSection = document.createElement('div');
      currentSection.className = 'perf-section';
      var lhd = document.createElement('div');
      lhd.className = 'perf-lhd';
      lhd.textContent = line.replace(/[\[\]]/g,'');
      currentSection.appendChild(lhd);
      body.appendChild(currentSection);
    } else if(line.trim()) {
      if(!currentSection){ currentSection = document.createElement('div'); currentSection.className='perf-section'; body.appendChild(currentSection); }
      var ln = document.createElement('div');
      ln.className = 'perf-line';
      ln.textContent = line;
      currentSection.appendChild(ln);
    }
  });
  if(!s.lyrics || !s.lyrics.trim()){
    body.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#333;font-family:Inter,sans-serif;font-size:13px;letter-spacing:1px;">No lyrics yet</div>';
  }
  ov.classList.add('open');
  body.scrollTop = 0;
  if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});
}

function exitPerfMode(){
  stopPerfScroll();
  document.getElementById('perfOverlay').classList.remove('open');
}

function perfFontSize(d){
  perfFontSz = Math.max(14, Math.min(38, perfFontSz + d));
  document.querySelectorAll('.perf-line').forEach(function(el){ el.style.fontSize = perfFontSz + 'px'; });
}

function togglePerfScroll(){
  perfScrollOn = !perfScrollOn;
  var btn = document.getElementById('perfScrollBtn');
  btn.classList.toggle('on', perfScrollOn);
  btn.textContent = perfScrollOn ? '⏹ Stop' : '↓ Auto scroll';
  if(perfScrollOn){
    perfScrollTimer = setInterval(function(){
      var b = document.getElementById('perfBody');
      b.scrollTop += 1;
      if(b.scrollTop + b.clientHeight >= b.scrollHeight){ stopPerfScroll(); }
    }, 50);
  } else { stopPerfScroll(); }
}

function stopPerfScroll(){
  perfScrollOn = false;
  if(perfScrollTimer){ clearInterval(perfScrollTimer); perfScrollTimer=null; }
  var btn = document.getElementById('perfScrollBtn');
  if(btn){ btn.classList.remove('on'); btn.textContent='↓ Auto scroll'; }
}

initFirebase();
rConcerts();rList();rStatusFilter();
applyLang();
</script>

<div class="perf-overlay" id="perfOverlay">
  <div class="perf-hdr">
    <div class="perf-meta" id="perfMeta"></div>
    <div class="perf-key-info" id="perfKeyInfo"></div>
    <button class="perf-exit" onclick="exitPerfMode()">✕</button>
  </div>
  <div class="perf-body" id="perfBody"></div>
  <div class="perf-footer">
    <span class="perf-font-lbl">A</span>
    <button class="perf-fbtn" onclick="perfFontSize(-2)">−</button>
    <button class="perf-fbtn" onclick="perfFontSize(+2)">+</button>
    <button class="perf-scroll" id="perfScrollBtn" onclick="togglePerfScroll()">↓ Auto scroll</button>
  </div>
</div>
<script>
// Auto-update: register service worker for background updates
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.addEventListener('updatefound', function(){
      var newWorker = reg.installing;
      newWorker.addEventListener('statechange', function(){
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
          // New version available - reload automatically
          window.location.reload();
        }
      });
    });
  }).catch(function(){});
  // Check for updates every time page becomes visible
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg) reg.update();
      });
    }
  });
}
</script>
