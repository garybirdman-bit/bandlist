<style>
:root{
  --or:#D4793F;--or-dim:rgba(212,121,63,0.15);
  --bg:#1a1a1f;--s1:#22222a;--s2:#2a2a34;--s3:#32323e;
  --br:#32323e;--tx:#f0ece4;--tx2:#d0ccc4;--mu:#b0aaa4;--mu2:#707070;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Montserrat',sans-serif;font-weight:300;}
body{display:flex;flex-direction:column;height:100vh;font-family:'Golos Text',sans-serif;}

/* HEADER */
.hdr{padding:28px 20px 0;flex-shrink:0;background:var(--bg);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.logo{font-family:'Inter',sans-serif;font-size:17px;font-weight:600;letter-spacing:7px;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:12px;}
.add-btn{width:34px;height:34px;background:var(--or);border:none;border-radius:50%;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 12px rgba(212,121,63,0.3);}
#undoToast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2a2a36;border:1px solid #3a3a46;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-family:'Golos Text',sans-serif;font-size:13px;color:#f0ece4;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.5);white-space:nowrap;transition:opacity .3s;opacity:0;pointer-events:none;}
#undoToast.show{opacity:1;pointer-events:auto;}
#undoToastBtn{background:none;border:none;color:#D4793F;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:0;}
.more-btn{display:none!important;}

/* NAV TABS (Сетлист / Репертуар) */
.nav-tabs{display:flex;gap:0;border-bottom:1px solid var(--br);margin-bottom:0;flex-shrink:0;}
.nav-tab{flex:1;background:none;border:none;color:var(--mu);font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;padding:10px 0;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.nav-tab.on{color:var(--or);border-bottom-color:var(--or);}

/* CONCERT TABS */
.ctabs{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:10px 20px 10px;scrollbar-width:none;background:var(--bg);}
.ctabs::-webkit-scrollbar{display:none;}
.ctab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:1px;cursor:pointer;border:1px solid rgba(212,121,63,0.5);background:transparent;color:#D4793F;transition:all .2s;white-space:nowrap;}
.ctab.on{background:#C86830;border-color:#C86830;color:#fff;font-weight:500;}
.ctab input{background:none;border:none;outline:none;color:#fff;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;letter-spacing:1px;width:90px;padding:0;}
.cadd{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid rgba(212,121,63,0.5);background:transparent;color:#D4793F;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* SEARCH */
.search-wrap{padding:8px 12px;background:var(--bg);flex-shrink:0;}
.search-inner{position:relative;}
.search-inp{width:100%;background:var(--s1);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:9px 14px 9px 36px;font-size:13px;font-family:'Montserrat',sans-serif;font-weight:300;outline:none;}
.search-inp:focus{border-color:var(--or);}
.search-inp::placeholder{color:var(--mu2);}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;}

.divl{height:1px;background:var(--br);flex-shrink:0;}

/* LIST */
.lw{flex:1;overflow-y:auto;scrollbar-width:none;background:var(--bg);padding-top:4px;padding-bottom:80px;}
.lw::-webkit-scrollbar{display:none;}

/* SECTIONS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;}
.sec-name{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--or);font-weight:500;font-family:'Inter',sans-serif;}
.sec-time{font-size:10px;color:#888;font-family:'Inter',sans-serif;letter-spacing:.5px;margin-left:8px;}
.sec-left{display:flex;align-items:center;}
.sec-acts{display:flex;gap:2px;padding-right:14px;}
.sec-btn{background:none;border:none;color:var(--or);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:4px;opacity:.9;}
.sec-btn.red{color:var(--or);opacity:.9;}
.add-sec-row{padding:0 0 20px;}
.drop-placeholder{display:flex;align-items:center;justify-content:center;margin:0 12px 6px;background:transparent;border:1.5px dashed #3a3a46;border-radius:14px;height:52px;color:#3a3a46;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;}
.sec-add-song{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 12px 8px;background:transparent;border:1px solid rgba(212,121,63,0.6);border-radius:14px;height:44px;color:#D4793F;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;width:calc(100% - 24px);}
.sec-add-song:hover,.sec-add-song:active{border-color:#D4793F;color:#D4793F;background:rgba(212,121,63,0.05);}
.drop-placeholder.drag-over{border-color:#D4793F;background:rgba(212,121,63,0.06);color:#D4793F;}
.add-sec-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 12px 8px;background:transparent;border:1px solid rgba(212,121,63,0.6);border-radius:14px;height:44px;color:#D4793F;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;width:calc(100% - 24px);}

/* SONG ROWS */
.row{display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;margin:0 12px 6px;background:var(--s1);border-radius:14px;min-height:62px;}
.row.dragging{opacity:.3;}
.row.dover{background:var(--s2);border:1px solid var(--or);}
.dh{display:flex;flex-direction:column;gap:4px;cursor:grab;padding:4px 2px;flex-shrink:0;touch-action:none;}
.dh span{display:block;width:14px;height:1.5px;background:var(--mu2);border-radius:2px;}
.snum{font-family:'Golos Text',sans-serif;font-size:13px;color:var(--mu);width:16px;text-align:center;flex-shrink:0;}
.si{flex:1;min-width:0;cursor:pointer;}
.st{font-family:'Golos Text',sans-serif;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;letter-spacing:-.2px;}
.ss{font-size:10px;color:#888;margin-top:3px;letter-spacing:.5px;text-transform:uppercase;font-family:'Golos Text',sans-serif;}
.sk{font-family:'Golos Text',sans-serif;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;width:28px;text-align:center;}
.sdel{background:none;border:none;color:var(--tx2);font-size:12px;cursor:pointer;padding:4px;flex-shrink:0;opacity:.7;}
.sdel:hover{color:#e05252;opacity:1;}

/* STATUS BADGE */
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;}
.status-ready{background:#00B4A6;}
.status-learning{background:#F0922B;}

.status-idea{background:#845EC2;}

/* REPERTOIRE */
.rep-row{display:flex;align-items:center;gap:10px;padding:0 14px;margin:0 12px 6px;background:var(--s1);border-radius:14px;cursor:pointer;min-height:62px;}
.rep-row.dover{background:var(--s2);border:1px solid var(--or);}
.rep-row.dragging{opacity:.3;}
.rep-row:hover{background:var(--s2);}
.rep-info{flex:1;min-width:0;}
.rep-title{font-family:'Golos Text',sans-serif;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;letter-spacing:-.2px;}
.rep-sub{font-size:10px;color:#888;margin-top:3px;letter-spacing:.5px;text-transform:uppercase;font-family:'Golos Text',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rep-key{font-family:'Golos Text',sans-serif;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;width:28px;text-align:center;}
.rep-actions{display:flex;gap:6px;flex-shrink:0;}
.rep-add-btn{background:transparent;border:1px solid rgba(212,121,63,0.6);border-radius:8px;color:var(--or);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:0;padding:4px 10px;cursor:pointer;transition:all .2s;flex-shrink:0;white-space:nowrap;}
.rep-del{background:none;border:none;color:#D4793F;font-size:12px;cursor:pointer;padding:4px;}
.rep-dh{display:flex;flex-direction:column;gap:4px;cursor:grab;padding:4px 2px;flex-shrink:0;touch-action:none;}
.rep-dh span{display:block;width:14px;height:1.5px;background:var(--mu2);border-radius:2px;}
.rep-del:hover{color:#e05252;}
.status-filter{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.status-filter::-webkit-scrollbar{display:none;}
.sf-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:400;letter-spacing:1px;cursor:pointer;border:1px solid var(--s3);background:var(--s1);color:var(--tx2);transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.sf-btn.on{border-color:#C86830;color:#fff;background:#C86830;font-weight:500;}

/* SLIDE PANEL */
.panel{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.panel.open{transform:translateY(0);}
.ph{padding:20px 16px 0;flex-shrink:0;background:var(--bg);}
@media (orientation:landscape){
  .ph{padding:6px 12px 0;}
  .lp-header{display:flex!important;}
}
/* Landscape header player */
.lp-header{
  display:none;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.lp-play{width:30px;height:30px;border-radius:50%;background:#D4793F;border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lp-prog{flex:1;height:4px;background:#2a2a34;border-radius:2px;cursor:pointer;position:relative;min-width:80px;}
.lp-prog-fill{height:100%;background:#D4793F;border-radius:2px;position:absolute;left:0;top:0;transition:width .1s linear;pointer-events:none;}
.lp-time{font-family:'Inter',sans-serif;font-size:9px;color:#555;letter-spacing:.5px;flex-shrink:0;}
@media (orientation:landscape){
  .ph{padding:6px 12px 0;}
  .landscape-player{display:flex!important;}
}
.landscape-player{
  display:none;
  position:fixed;
  right:0;top:0;bottom:0;
  width:52px;
  background:#1a1a1f;
  border-left:1px solid #2a2a34;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  z-index:15;
  padding:8px 0;
}
.lp-play{width:36px;height:36px;border-radius:50%;background:#D4793F;border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lp-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:0 10px;}
.lp-prog{width:6px;flex:1;background:#2a2a34;border-radius:3px;cursor:pointer;position:relative;max-height:160px;}
.lp-prog-fill{width:100%;background:#D4793F;border-radius:3px;position:absolute;bottom:0;left:0;transition:height .1s linear;}
.lp-time{font-family:'Inter',sans-serif;font-size:8px;color:#555;letter-spacing:.5px;writing-mode:vertical-rl;transform:rotate(180deg);}
.lp-notrack{font-size:18px;color:#2a2a34;}
@media (orientation:landscape){
  .ph{padding:6px 12px 0;}
  .lp-header{display:flex!important;}
}
/* Landscape header player */
.lp-header{
  display:none;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}
.lp-play{width:30px;height:30px;border-radius:50%;background:#D4793F;border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lp-prog{flex:1;height:4px;background:#2a2a34;border-radius:2px;cursor:pointer;position:relative;min-width:80px;}
.lp-prog-fill{height:100%;background:#D4793F;border-radius:2px;position:absolute;left:0;top:0;transition:width .1s linear;pointer-events:none;}
.lp-time{font-family:'Inter',sans-serif;font-size:9px;color:#555;letter-spacing:.5px;flex-shrink:0;}
@media (orientation:landscape){
  .ph{padding:18px 12px 4px;}
  .ph-top{flex-direction:row!important;align-items:center!important;gap:10px!important;margin-bottom:0!important;}
  .ph-info{display:flex!important;flex-direction:column-reverse!important;gap:1px!important;flex-shrink:0!important;}
  .pa{font-size:13px!important;letter-spacing:1px!important;margin-bottom:0!important;display:block!important;color:#D4793F!important;border-bottom:none!important;}
  .pa span{border-bottom:none!important;cursor:default!important;}
  .pt{font-size:24px!important;font-weight:500!important;display:block!important;line-height:1.2!important;}
  .lp-inline{display:flex!important;}
  .ptabs{display:none!important;}
  .panel-form-active .ptabs{display:none!important;}
  .lp-header{display:none!important;}
  .ctrls-compact{display:flex!important;}
  .ctrls{display:none!important;}
  #playerSlot{display:none!important;}
  #pb{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;}
}
.ph-top{display:flex;justify-content:space-between;align-items:center;}
.pa{font-size:13px;color:var(--or);letter-spacing:2px;text-transform:uppercase;flex-shrink:0;white-space:nowrap;}
.pt{font-family:'Golos Text',sans-serif;font-size:24px;font-weight:500;line-height:1;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0;}
.pcl{background:transparent;border:none;color:var(--mu);width:auto;height:auto;font-size:14px;font-weight:400;cursor:pointer;flex-shrink:0;padding:0 0 0 8px;line-height:1;}
.ph-title-row{display:flex;align-items:baseline;gap:0;width:100%;}
.ph-sep{font-size:16px;color:#3a3a46;margin:0 8px;flex-shrink:0;font-weight:300;}
.ptabs{display:flex;margin-top:14px;border-bottom:1px solid var(--br);overflow-x:auto;scrollbar-width:none;}
.ptabs::-webkit-scrollbar{display:none;}
.ptab{background:none;border:none;color:var(--mu);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.ptab.on{color:var(--or);border-bottom-color:var(--or);}

/* CONTROLS */
.ctrls{display:flex;gap:8px;padding:12px 12px 0;flex-shrink:0;background:var(--bg);align-items:stretch;overflow:visible;}
.ctrls-compact{display:none;padding:6px 14px;border-bottom:1px solid var(--br);flex-shrink:0;background:var(--bg);align-items:center;gap:16px;}
.ctrls-compact-item{font-family:'Inter',sans-serif;font-size:10px;color:#D4793F;letter-spacing:1.5px;text-transform:uppercase;}
.ctrls-compact-val{color:#fff;font-weight:500;margin-left:4px;font-size:12px;}
@media (orientation:landscape){
  .panel-form-active .ctrls{display:none;}
  .panel-form-active .ctrls-compact{display:flex;}
  .panel-form-active #playerSlot{display:none;}
}
.cb{flex:1;background:var(--s2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.cl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);font-weight:400;text-align:center;width:100%;display:block;}
.cr{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.cv{font-family:'Golos Text',sans-serif;font-size:20px;font-weight:600;min-width:40px;text-align:center;color:var(--tx);}
.cv.or{color:#fff !important;font-size:24px;}
.cbtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--br);background:var(--s3);color:var(--tx);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cbtn:active{background:var(--br);}
.tapbtn{height:26px;border-radius:8px;border:1px solid var(--or);background:transparent;color:var(--or);font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:100%;font-weight:500;}
.tapbtn:active{background:var(--or);color:#fff;}

/* PANEL BODY */
.pb{flex:1;overflow-y:auto;padding:14px 12px 50px;scrollbar-width:none;background:var(--bg);}
.pb::-webkit-scrollbar{display:none;}

/* FORM TAB */
.fr{display:flex;align-items:center;gap:6px;padding:10px 10px;margin-bottom:6px;background:var(--s1);border-radius:12px;}
.fi2{font-family:'Golos Text',sans-serif;font-size:12px;color:var(--or);width:14px;text-align:center;flex-shrink:0;}
.fn-inp{background:none;border:none;border-bottom:1px solid var(--br);color:var(--tx);font-family:'Montserrat',sans-serif;font-size:13px;font-weight:300;outline:none;flex:1;padding:2px 0;min-width:0;}
.fn-inp:focus{border-bottom-color:var(--or);}
.ftbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--br);background:var(--s2);color:var(--tx2);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ftval{font-family:'Golos Text',sans-serif;font-size:17px;color:var(--tx);min-width:26px;text-align:center;flex-shrink:0;font-weight:600;}
.form-add-btn{width:100%;padding:14px;border:1px dashed var(--or);border-radius:12px;background:var(--or-dim);color:var(--or);font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px;font-weight:500;}

/* LYRICS */
.lyr{font-size:14px;line-height:2;font-weight:300;color:var(--tx2);}
.lhd{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--or);margin-top:20px;margin-bottom:5px;}
.lhd:first-child{margin-top:0;}

/* CHORDS + NOTES */
.ta{width:100%;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:12px;font-size:14px;font-family:'Courier New',monospace;outline:none;resize:none;min-height:160px;line-height:1.9;}
.ta.notes{font-family:'Montserrat',sans-serif;font-weight:300;font-size:13px;line-height:1.8;}
.ta:focus{border-color:var(--or);}
.ta-hint{font-size:10px;color:var(--tx2);letter-spacing:1px;margin-bottom:8px;}
.chord-sec{margin-bottom:8px;background:var(--s1);border-radius:12px;overflow:hidden;}
.chord-sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;}
.chord-sec-name{font-size:13px;color:var(--tx2);display:flex;align-items:center;gap:8px;letter-spacing:.3px;}
.chord-sec-del{background:none;border:none;color:var(--mu2);font-size:12px;cursor:pointer;padding:2px 6px;}
.chord-sec-ta{background:none;border:none;border-top:1px solid var(--br);color:var(--tx);padding:10px 14px;font-size:15px;font-family:'Courier New',monospace;outline:none;resize:none;min-height:44px;line-height:1.7;width:100%;}
.chord-sec-ta:focus{background:var(--s2);}
.chord-add-btn{width:100%;padding:11px;border:1px dashed var(--s3);border-radius:12px;background:transparent;color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:4px;}
/* section type picker */
.sec-type-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.sec-type-btn{padding:9px 16px;border-radius:10px;border:1px solid var(--br);background:var(--s1);color:var(--tx2);font-family:'Montserrat',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;}
.sec-type-btn:hover{border-color:var(--or);color:var(--or);}

/* PLAYER */
.player-wrap{background:var(--s2);border-radius:14px;padding:12px 14px;margin-bottom:0;}
.player-controls{display:flex;align-items:center;gap:12px;}
.player-playbtn{width:42px;height:42px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.player-info{flex:1;min-width:0;}
.player-fname{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
.player-progress{width:100%;height:3px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative;margin-bottom:6px;}
.player-progress-fill{height:100%;background:var(--or);border-radius:2px;transition:width .1s linear;pointer-events:none;position:relative;}
.player-progress-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--or);}
.player-times{display:flex;justify-content:space-between;font-size:10px;color:var(--mu2);font-family:'Golos Text',sans-serif;}
.player-del{background:none;border:none;color:var(--mu2);font-size:11px;cursor:pointer;padding:4px;flex-shrink:0;}
.player-vol-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
.player-vol-icon{display:flex;align-items:center;justify-content:center;width:42px;flex-shrink:0;}
.player-vol{flex:1;height:3px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative;}
.player-vol-fill{height:100%;background:var(--mu2);border-radius:2px;pointer-events:none;position:relative;}
.player-vol-fill::after{content:'';position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:#888;}
.player-vol-spacer{width:22px;flex-shrink:0;}

/* MODAL */
.modal{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.modal.open{transform:translateY(0);}
.mi{flex:1;overflow-y:auto;padding:22px 16px 60px;scrollbar-width:none;}
.mi::-webkit-scrollbar{display:none;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.mt{font-family:'Golos Text',sans-serif;font-size:22px;font-weight:600;letter-spacing:1px;color:var(--tx);}
.fl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:7px;margin-top:18px;font-weight:400;}
.fl:first-child{margin-top:0;}
.fi{width:100%;background:var(--s2);border:1px solid var(--br);border-radius:12px;color:var(--tx);padding:11px 13px;font-size:15px;font-family:'Montserrat',sans-serif;font-weight:300;outline:none;}
.fi:focus{border-color:var(--or);}
select.fi{cursor:pointer;}
textarea.fi{resize:none;min-height:80px;}
textarea.fi.tall{min-height:120px;}
.kg{display:flex;flex-wrap:wrap;gap:6px;}
.kb{border-radius:8px;padding:5px 10px;font-size:13px;font-family:'Golos Text',sans-serif;font-weight:600;cursor:pointer;border:1px solid var(--br);background:var(--s1);color:var(--tx2);}
.kb.on{background:var(--or-dim);border-color:var(--or);color:var(--or);}
.clrs{display:flex;gap:8px;flex-wrap:wrap;}
.cc{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.cc.on{border-color:#fff;transform:scale(1.2);}
.subbtn{display:flex;align-items:center;justify-content:center;width:100%;height:44px;border:1px solid rgba(212,121,63,0.6);border-radius:14px;background:transparent;color:#D4793F;font-family:'Inter',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all .2s;}
.delbtn{width:100%;padding:12px;border:1px solid #e05252;border-radius:12px;background:transparent;color:#e05252;font-family:'Montserrat',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:10px;}

/* STATUS SELECTOR */
.status-row{display:flex;gap:8px;flex-wrap:wrap;}
.st-btn{padding:7px 14px;border-radius:10px;font-size:11px;font-family:'Montserrat',sans-serif;font-weight:500;cursor:pointer;border:1px solid var(--br);background:var(--s1);color:var(--tx2);transition:all .15s;letter-spacing:.5px;}
.st-btn.on-ready{background:rgba(0,180,166,.2);border-color:#00B4A6;color:#00B4A6;}
.st-btn.on-learning{background:rgba(240,146,43,.2);border-color:#F0922B;color:#F0922B;}

.st-btn.on-idea{background:rgba(132,94,194,.2);border-color:#845EC2;color:#845EC2;}

/* CTX */
.cxov{position:fixed;inset:0;z-index:49;}
.cxm{position:fixed;background:var(--s2);border:1px solid var(--br);border-radius:14px;overflow:hidden;z-index:50;min-width:180px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:cxi .14s ease;}
@keyframes cxi{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.cxi{display:flex;align-items:center;gap:10px;padding:13px 17px;font-size:13px;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;background:none;color:var(--tx);width:100%;text-align:left;}
.cxi:hover{background:var(--s3);}
.cxi.red{color:#e05252;}
.cxi.off{opacity:.3;cursor:default;pointer-events:none;}
.cxi+.cxi{border-top:1px solid var(--br);}

/* OVERFLOW MENU */
.overflow-menu{position:fixed;right:16px;top:68px;background:var(--s2);border:1px solid var(--br);border-radius:14px;overflow:hidden;z-index:50;min-width:180px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:cxi .14s ease;display:none;}
.overflow-menu.open{display:block;}
.om-item{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:13px;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;background:none;color:var(--tx);width:100%;text-align:left;}
.om-item:hover{background:var(--s3);}
.om-item+.om-item{border-top:1px solid var(--br);}

/* ADD FROM REPERTOIRE MODAL */
.rep-pick-row{display:flex;align-items:center;gap:10px;padding:11px 14px;margin-bottom:6px;background:var(--s1);border-radius:12px;cursor:pointer;}
.rep-pick-row:hover{background:var(--s2);}
.rep-pick-row.picked{border:1px solid var(--or);}
.rpr-info{flex:1;min-width:0;}
.rpr-title{font-family:'Golos Text',sans-serif;font-size:16px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rpr-sub{font-size:10px;color:var(--tx2);margin-top:2px;letter-spacing:1px;text-transform:uppercase;}


/* PERFORMANCE MODE */
.perf-overlay{position:fixed;inset:0;background:#0d0d0f;z-index:100;display:none;flex-direction:column;}
.perf-overlay.open{display:flex;}
.perf-hdr{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #1a1a1f;}
.perf-meta{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.perf-key-info{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;color:var(--or);flex-shrink:0;white-space:nowrap;}
.perf-exit{background:none;border:none;color:var(--mu);font-family:'Inter',sans-serif;font-size:14px;cursor:pointer;padding:4px 0;flex-shrink:0;}
.perf-body{flex:1;overflow-y:auto;padding:16px 24px 40px;scrollbar-width:none;}
.perf-body::-webkit-scrollbar{display:none;}
.perf-section{margin-bottom:28px;}
.perf-lhd{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--or);margin-bottom:10px;opacity:0.8;}
.perf-line{font-size:22px;font-weight:500;line-height:1.65;color:#f0ece4;letter-spacing:0.2px;}
.perf-footer{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid #2a2a34;flex-shrink:0;background:#111114;}
.perf-font-lbl{font-family:'Inter',sans-serif;font-size:13px;color:#888;letter-spacing:1px;text-transform:uppercase;}
.perf-fbtn{background:none;border:1px solid #3a3a46;border-radius:6px;color:#c0bbb5;font-size:16px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.perf-fbtn:hover{border-color:#888;color:#fff;}
.perf-scroll{flex:1;background:none;border:1px solid #3a3a46;border-radius:8px;color:#c0bbb5;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:0 12px;cursor:pointer;transition:all .2s;text-align:center;line-height:1.3;height:36px;display:flex;align-items:center;justify-content:center;}
.perf-scroll.on{border-color:var(--or);color:var(--or);background:rgba(212,121,63,0.08);}


/* SONG MAP */
.map-canvas{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;align-items:flex-end;padding-bottom:20px;}
.map-blk-grp{display:flex;flex-direction:column;gap:3px;flex-shrink:0;}
.map-blk-lbl{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding-left:1px;white-space:nowrap;}
@media (orientation:landscape){.map-blk-lbl{font-size:13px!important;font-weight:700!important;letter-spacing:1.5px!important;}}
.map-blk-row{display:flex;gap:3px;align-items:center;}
.map-blk{width:44px;height:44px;border-radius:7px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .1s;}
.map-blk:active{transform:scale(.88);}
.map-blk-num{font-size:8px;font-weight:600;color:rgba(0,0,0,0.3);position:absolute;top:3px;left:4px;}
.map-blk-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:rgba(0,0,0,0.5);text-align:center;padding:2px;line-height:1.2;}
.map-blk-del{width:18px;height:18px;border-radius:50%;border:none;background:#2a2a34;color:#555;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:1px;}
.map-blk-add{width:44px;height:44px;border-radius:7px;border:1.5px dashed #3a3a46;background:transparent;color:#555;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.map-blk-add:active{border-color:#D4793F;color:#D4793F;}
.mc-intro {background:#E8C49A;}
.mc-verse {background:#B8D4A8;}
.mc-chorus{background:#9BB5D8;}
.mc-pre   {background:#C4A8D8;}
.mc-bridge{background:#C4B8D8;}
.mc-solo  {background:#F0D4A0;}
.mc-break {background:#D4C4A0;}
.mc-outro {background:#D4A8A8;}
.mc-coda  {background:#A8C4D4;}
.mc-other {background:#C8C8C8;}

/* MAP SHEET */
.map-sheet{position:fixed;bottom:0;left:0;right:0;background:#1e1e26;border-radius:16px 16px 0 0;z-index:100;padding:14px 16px 36px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
.map-sheet.open{transform:translateY(0);}
.map-sheet-handle{width:36px;height:4px;background:#3a3a46;border-radius:2px;margin:0 auto 12px;}
.map-sheet-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;}
.map-sec-list{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;max-height:40vh;overflow-y:auto;}
.map-sec-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;}
.map-sec-row.sel{background:#2a2a34;border-color:#D4793F;}
.map-sec-dot{width:26px;height:26px;border-radius:6px;flex-shrink:0;}
.map-sec-name{font-size:14px;font-weight:400;color:#f0ece4;}
.map-sec-chk{margin-left:auto;color:#D4793F;opacity:0;}
.map-sec-row.sel .map-sec-chk{opacity:1;}
.map-bars-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.map-bars-lbl{font-size:12px;color:#888;flex:1;}
.map-bars-btn{width:32px;height:32px;border-radius:8px;border:1px solid #3a3a46;background:none;color:#c0bbb5;font-size:16px;cursor:pointer;}
.map-bars-val{font-size:20px;font-weight:600;color:#fff;min-width:30px;text-align:center;}
.map-sheet-ok{width:100%;padding:11px;border:1px solid #D4793F;border-radius:10px;background:transparent;color:#D4793F;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.map-sheet-ov{position:fixed;inset:0;z-index:99;display:none;}
.map-sheet-ov.open{display:block;}

/* MAP NOTE */
.map-note-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:110;display:none;align-items:flex-end;}
.map-note-ov.open{display:flex;}
.map-note-box{background:#22222a;border-radius:16px 16px 0 0;padding:18px 16px 36px;width:100%;}
.map-note-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:10px;}
.map-note-inp{width:100%;background:#1a1a1f;border:1px solid #D4793F;border-radius:8px;color:#fff;padding:10px 12px;font-size:16px;font-family:'Inter',sans-serif;outline:none;}
.map-note-btns{display:flex;gap:8px;margin-top:10px;}
.map-note-ok{flex:1;padding:10px;border:1px solid #D4793F;border-radius:8px;background:transparent;color:#D4793F;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;}
.map-note-cancel{padding:10px 14px;border:1px solid #3a3a46;border-radius:8px;background:transparent;color:#888;font-family:'Inter',sans-serif;font-size:11px;cursor:pointer;}

@media (orientation:landscape){
  .pb{overflow:hidden!important;}
  .map-canvas{flex-wrap:wrap;}
}



/* Inline landscape player */
.ph-info{display:flex;flex-direction:column;gap:1px;}
.lp-inline{
  display:none;
  align-items:center;
  gap:8px;
  flex:1;
  min-width:0;
}
.lp-inline-play{width:24px;height:24px;border-radius:50%;background:#D4793F;border:none;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;}
.lp-inline-prog{flex:1;height:5px;background:#2a2a34;border-radius:3px;cursor:pointer;position:relative;min-width:60px;}
.lp-inline-fill{height:100%;background:#D4793F;border-radius:3px;position:absolute;left:0;top:0;pointer-events:none;transition:width .1s linear;}
.lp-inline-time{font-family:'Inter',sans-serif;font-size:9px;color:#555;flex-shrink:0;white-space:nowrap;}


/* Map block context menu */
.map-ctx-ov{position:fixed;inset:0;z-index:149;}
.map-ctx{position:fixed;background:#22222a;border:1px solid #3a3a46;border-radius:12px;overflow:hidden;z-index:150;min-width:160px;box-shadow:0 8px 32px rgba(0,0,0,.7);animation:cxi .14s ease;}
.map-ctx-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13px;font-family:'Montserrat',sans-serif;cursor:pointer;border:none;background:none;color:var(--tx);width:100%;text-align:left;}
.map-ctx-item:hover{background:var(--s3);}
.map-ctx-item+.map-ctx-item{border-top:1px solid var(--br);}
.map-ctx-item.red{color:#e05252;}

/* PRINT */
@media print{
  .hdr,.nav-tabs,.ctabs,.divl,.panel,.modal,.cxm,.cxov,.add-sec-row,.sec-acts,.dh,.sdel,.search-wrap,.overflow-menu,.status-filter{display:none!important;}
  html,body{height:auto!important;overflow:auto!important;}
  .lw{overflow:visible!important;height:auto!important;}
  .row{break-inside:avoid;margin:0 0 4px!important;}
  body{background:#fff!important;color:#000!important;}
  .st{color:#000!important;}
  .sec-name,.sk{color:#D4793F!important;}
  .ss,.snum{color:#555!important;}
  .phdr-print{display:block!important;}
}
.phdr-print{display:none;text-align:center;padding:16px 0 10px;font-family:'Golos Text',sans-serif;font-size:22px;letter-spacing:4px;border-bottom:2px solid #000;margin-bottom:8px;}
</style>
</head>

<div class="hdr">

      <svg width="26" height="26" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;">

        <rect x="5" y="4" width="2" height="12" rx="1" fill="#D4793F"/>
        <rect x="9" y="2" width="2" height="16" rx="1" fill="#D4793F"/>
        <rect x="13" y="4" width="2" height="12" rx="1" fill="#D4793F"/>
        <rect x="17" y="7" width="2" height="6" rx="1" fill="#D4793F"/>
      </svg>
      <span>Bandlist</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div id="syncDot" style="width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s;align-self:center;" title="Офлайн"></div>

      <button id="liveModeBtn" onclick="toggleLiveMode()" style="background:transparent;border:1.5px solid rgba(255,255,255,0.8);border-radius:4px;padding:2px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;height:18px;transition:all .2s;flex-shrink:0;">
        <span style="font-family:'Inter',sans-serif;font-size:10px;font-weight:700;line-height:1;color:rgba(255,255,255,0.9);letter-spacing:1px;">LIVE</span>
      </button>
      <button class="add-btn" id="mainAddBtn" onclick="mainAdd()">+</button>
    </div>

</div>

</div>
<div class="cxov" id="omOverlay" style="display:none" onclick="toggleOverflow()"></div>

<!-- SETLIST VIEW -->
<div id="viewSetlist" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
  <div class="ctabs" id="ctabs"></div>
  <div class="divl"></div>
  <div class="search-wrap">
    <div class="search-inner">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="#555" stroke-width="1.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-inp" id="srch" placeholder="Поиск..." oninput="rList()">
    </div>
  </div>
  <div class="lw" id="lw">
    <div class="phdr-print" id="phdrp"></div>
    <div id="list"></div>
    <div id="staticAddSec" style="display:none;">
      <button class="add-sec-btn" onclick="openAddSec()"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" style="flex-shrink:0"><line x1="5.5" y1="1" x2="5.5" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="5.5" x2="10" y2="5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>&nbsp;<span id="addSecBtnTxt">Добавить отделение</span></button>

    </div>
    <div id="secDialog" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a1f;z-index:200;padding:30px 20px;box-sizing:border-box;">
      <div style="font-family:'Golos Text',sans-serif;font-size:22px;color:#fff;margin-bottom:20px;" id="secDialogTitle">Новое отделение</div>

/* TRANSPOSE */
function txKey(key,st){
  var minor=key.length>1&&key.endsWith("m");var sc=minor?CHRm:CHR;var idx=sc.indexOf(key);
  if(idx<0){var en={"Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#","Dbm":"C#m","Ebm":"D#m","Gbm":"F#m","Abm":"G#m","Bbm":"A#m"};var e=en[key];idx=e?sc.indexOf(e):0;}
  return sc[((idx+st)%12+12)%12];
}
function transposeChordString(chordStr, st){
  // split by spaces, transpose each token that looks like a chord
  return chordStr.split(/\s+/).map(function(token){
    if(!token)return token;
    // match chord: root + optional modifier
    var m=token.match(/^([A-Ga-g][#b]?)(m?(?:maj|min|dim|aug|sus|add)?[0-9]*(?:\/[A-Ga-g][#b]?)?)$/);
    if(!m)return token;
    var root=m[1];var suffix=m[2];
    // handle slash chord bass note
    var slashMatch=suffix.match(/^(.*)\/([A-Ga-g][#b]?)$/);
    if(slashMatch){
      var newRoot=txKey(root,st);
      var newBass=txKey(slashMatch[2],st);
      return newRoot+slashMatch[1]+'/'+newBass;
    }
    return txKey(root,st)+suffix;
  }).join('  ');
}
function shiftKey(st){
  var s=findR(panel.id);if(!s)return;
  s.key=txKey(s.key,st);
  // transpose all chord blocks
  if(s.chordBlocks&&s.chordBlocks.length){
    s.chordBlocks.forEach(function(cb){
      if(cb.chords) cb.chords=transposeChordString(cb.chords,st);
    });
  }
  save();rPanel();rList();rRep();
}

  if(lbl)lbl.textContent=LANG==='en'?'Stop':'Стоп';

  },60000/bpm);
}

var _audioCtx=null;
function getAudioCtx(){
  try{
    if(!_audioCtx||_audioCtx.state==='closed'){
      _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    }
    if(_audioCtx.state==='suspended'){
      _audioCtx.resume();
    }
    return _audioCtx;
  }catch(e){return null;}
}
function playClick(accent){
  try{
    var ctx=getAudioCtx();
    if(!ctx)return;
    var t=ctx.currentTime;
    var osc=ctx.createOscillator();
    var gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(accent?1100:750,t);
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(accent?1.0:0.6,t+0.005);
    gain.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    osc.start(t);
    osc.stop(t+0.1);
  }catch(e){}
}
function tapTempo(){
  var now=Date.now();taps.push(now);taps=taps.filter(function(t){return now-t<3000;});
  if(taps.length<2)return;
  var sum=0;for(var i=1;i<taps.length;i++)sum+=taps[i]-taps[i-1];
  var s=findR(panel.id);if(!s)return;
  s.tempo=Math.max(40,Math.min(240,Math.round(60000/(sum/(taps.length-1)))));
  save();rPanel();rList();
}
function shiftFT(sid,fi,d){var s=findR(sid);if(!s)return;s.form[fi].b=Math.max(1,Math.min(256,(s.form[fi].b||4)+d));save();rPanel();}

function doAddSong(secId,sid,concertId){
  var cid=concertId||D.active;

  var sec=null;
  for(var i=0;i<allSecs.length;i++){if(+allSecs[i].id===+secId){sec=allSecs[i];break;}}
  if(!sec&&allSecs.length)sec=allSecs[0];
  if(!sec){
    sec={id:Date.now(),name:"1 отделение",songs:[]};
    if(!D.sections[cid])D.sections[cid]=[];
    D.sections[cid].push(sec);

  for(var j=0;j<sec.songs.length;j++){if(+sec.songs[j]===+sid){already=true;break;}}

/* DRAG */
function setupDrag(row,secId,songId){
  var handle=row.querySelector(".dh");
  var active=false,moved=false,startY=0,curRow=null;
  function allRows(){return Array.from(document.querySelectorAll(".row"));}
  function rowCenter(r){var rc=r.getBoundingClientRect();return rc.top+rc.height/2;}
  function start(y){active=true;moved=false;startY=y;curRow=null;dragState={secId:secId,songId:songId};document.body.style.userSelect="none";}
  function move(y){
    if(!active)return;if(Math.abs(y-startY)<10)return;
    moved=true;row.classList.add("dragging");row.classList.remove("dover");
    var others=allRows().filter(function(r){return !r.classList.contains("dragging");});
    others.forEach(function(r){r.classList.remove("dover");});
    // find row that finger is directly over
    var best=null;
    others.forEach(function(r){
      var rc=r.getBoundingClientRect();
      if(y>=rc.top&&y<=rc.bottom){best=r;}
    });
    // fallback: nearest by center if not directly over any row
    if(!best){
      var bd=999999;
      others.forEach(function(r){var d=Math.abs(rowCenter(r)-y);if(d<bd&&d<60){bd=d;best=r;}});
    }
    if(best){best.classList.add("dover");curRow=best;}
  }
  function end(){
    if(!active)return;active=false;
    row.classList.remove("dragging");row.classList.remove("dover");
    allRows().forEach(function(r){r.classList.remove("dover");});
    document.body.style.userSelect="";
    if(moved&&curRow&&curRow!==row){
      var toSecId=+curRow.dataset.secId;var toSongId=+curRow.dataset.songId;
      var fromSec=secs().find(function(s){return s.id===secId;});
      var toSec=secs().find(function(s){return s.id===toSecId;});
      if(fromSec&&toSec){
        var fi=fromSec.songs.indexOf(songId);var ti=toSec.songs.indexOf(toSongId);
        if(fi>-1&&ti>-1){fromSec.songs.splice(fi,1);toSec.songs.splice(ti,0,songId);save();rList();}
      }
    }
    dragState={idx:null,secId:null};curRow=null;
  }
  handle.addEventListener("touchstart",function(e){start(e.touches[0].clientY);e.preventDefault();},{passive:false});
  handle.addEventListener("touchmove",function(e){
    move(e.touches[0].clientY);
    // highlight drop placeholder under finger
    var touch=e.touches[0];
    document.querySelectorAll(".drop-placeholder").forEach(function(ph){
      var r=ph.getBoundingClientRect();
      if(touch.clientY>=r.top&&touch.clientY<=r.bottom&&touch.clientX>=r.left&&touch.clientX<=r.right){
        ph.classList.add("drag-over");
      } else {
        ph.classList.remove("drag-over");
      }
    });
    e.preventDefault();
  },{passive:false});
  handle.addEventListener("touchend",function(e){
    // check if dropped on placeholder
    var touch=e.changedTouches[0];
    var dropped=false;
    document.querySelectorAll(".drop-placeholder").forEach(function(ph){
      ph.classList.remove("drag-over");
      var r=ph.getBoundingClientRect();
      if(touch.clientY>=r.top&&touch.clientY<=r.bottom&&touch.clientX>=r.left&&touch.clientX<=r.right){
        dropToSection(songId,secId,+ph.dataset.secId);
        dropped=true;
      }
    });
    if(!dropped)end();
    else{active=false;row.classList.remove("dragging");row.classList.remove("dover");document.body.style.userSelect="";}
  });
  handle.addEventListener("mousedown",function(e){start(e.clientY);var mm=function(ev){move(ev.clientY);};var mu=function(){end();document.removeEventListener("mousemove",mm);document.removeEventListener("mouseup",mu);};document.addEventListener("mousemove",mm);document.addEventListener("mouseup",mu);e.preventDefault();});
}

  } else {
    lph.innerHTML=loadBtn
      +'<button id="lpInlinePlay" onclick="togglePlay()" style="width:24px;height:24px;border-radius:50%;background:#D4793F;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;">'+playSvg+'</button>'
      +'<div id="lpInlineProg" style="flex:1;height:4px;background:#2a2a34;border-radius:2px;cursor:pointer;position:relative;">'
      +'<div id="lpInlineFill" style="width:0%;height:100%;background:#D4793F;border-radius:2px;position:absolute;left:0;top:0;pointer-events:none;"></div></div>'
      +'<span id="lpInlineTime" style="font-family:Inter,sans-serif;font-size:9px;color:#555;flex-shrink:0;">0:00</span>';
  }
  setTimeout(function(){

    var lb=document.getElementById('lpLoadBtn_'+s.id);

      var _sid=parseInt(lb.getAttribute('data-songid'));
      lb.addEventListener('click',function(e){
        e.preventDefault();e.stopPropagation();
        triggerTrackUpload(_sid);
      });
      lb.addEventListener('touchstart',function(e){
        e.stopPropagation();
      },{passive:true});
      lb.addEventListener('touchend',function(e){
        e.preventDefault();e.stopPropagation();
        triggerTrackUpload(_sid);
      },{passive:false});
    }

    var prog=document.getElementById('lpInlineProg');

        var rect=prog.getBoundingClientRect();

function fmtTime(t){if(isNaN(t))return"0:00";var m=Math.floor(t/60);var s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
function initAudio(s){
  // don't restart if same song is already loaded
  if(audioTrackSongId===s.id&&audioObj){
    // just re-hook the UI elements without stopping playback
    hookAudioEvents();
    return;
  }
  if(audioObj){audioObj.pause();audioObj=null;}
  audioTrackSongId=s.id;
  audioObj=new Audio(s.trackData);audioObj.volume=audioVolume;
  hookAudioEvents();}
function hookAudioEvents(){
  if(!audioObj)return;
  audioObj.ontimeupdate=function(){
    var pf=document.getElementById("progFill");var ct=document.getElementById("curTime");
    var lpf=document.getElementById("lpFill");var lpt=document.getElementById("lpTime");var lpb=document.getElementById("lpPlayBtn");
    var ilf=document.getElementById("lpInlineFill");var ilt=document.getElementById("lpInlineTime");var ilb=document.getElementById("lpInlinePlay");
    var pct=audioObj.duration?(audioObj.currentTime/audioObj.duration*100):0;
    if(pf&&audioObj.duration)pf.style.width=pct+"%";
    if(ct)ct.textContent=fmtTime(audioObj.currentTime);
    if(lpf)lpf.style.width=pct+"%";
    if(lpt)lpt.textContent=fmtTime(audioObj.currentTime);
    if(lpb)lpb.textContent=audioObj.paused?"▶":"■";
    var svgPlay2='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="3,2 16,9 3,16" fill="#D4793F"/></svg>';
    var svgStop2='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" fill="#D4793F"/></svg>';
    var mb=document.getElementById("playBtn");if(mb)mb.innerHTML=audioObj.paused?svgPlay2:svgStop2;
    if(ilf)ilf.style.width=pct+"%";
    if(ilt)ilt.textContent=fmtTime(audioObj.currentTime);
    if(ilb){var ps='<svg width="9" height="10" viewBox="0 0 9 10" fill="none"><polygon points="2,0.5 9,5 2,9.5" fill="white"/></svg>';var pa='<svg width="9" height="10" viewBox="0 0 9 10" fill="none"><rect x="1" y="0.5" width="2.5" height="9" rx="1" fill="white"/><rect x="5.5" y="0.5" width="2.5" height="9" rx="1" fill="white"/></svg>';ilb.innerHTML=audioObj.paused?ps:pa;}
  };
  audioObj.onloadedmetadata=function(){var dt=document.getElementById("durTime");if(dt)dt.textContent=fmtTime(audioObj.duration);};
  audioObj.onended=function(){
    var svgPlay='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="3,2 16,9 3,16" fill="#D4793F"/></svg>';
    var btn=document.getElementById("playBtn");if(btn)btn.innerHTML=svgPlay;
    var lpb=document.getElementById("lpPlayBtn");if(lpb)lpb.textContent="▶";
    var ipb=document.getElementById("lpInlinePlay");if(ipb)ipb.innerHTML='<svg width="9" height="10" viewBox="0 0 9 10" fill="none"><polygon points="2,0.5 9,5 2,9.5" fill="white"/></svg>';
    audioTrackSongId=null;
  };

}
function togglePlay(){
  if(!audioObj)return;
  var btn=document.getElementById("playBtn");
  var svgPlay='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><polygon points="3,2 16,9 3,16" fill="#D4793F"/></svg>';
  var svgStop='<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" fill="#D4793F"/></svg>';
  if(audioObj.paused){audioObj.play();if(btn)btn.innerHTML=svgStop;}
  else{audioObj.pause();if(btn)btn.innerHTML=svgPlay;}
}
function seekAudio(e){
  if(!audioObj||!audioObj.duration)return;
  var bar=document.getElementById("progBar");if(!bar)return;
  var rect=bar.getBoundingClientRect();
  var clientX=e.changedTouches?e.changedTouches[0].clientX:(e.touches?e.touches[0].clientX:e.clientX);
  audioObj.currentTime=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width))*audioObj.duration;
}
function setVolume(e){
  var bar=document.getElementById("volBar");if(!bar)return;
  var rect=bar.getBoundingClientRect();
  var clientX=e.changedTouches?e.changedTouches[0].clientX:(e.touches?e.touches[0].clientX:e.clientX);
  audioVolume=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
  if(audioObj)audioObj.volume=audioVolume;
  var vf=document.getElementById("volFill");if(vf)vf.style.width=(audioVolume*100)+"%";
}
function loadTrack(sid,input){
  var file=input.files[0];if(!file)return;
  var s=findR(sid);if(!s)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var mb=(e.target.result.length*0.75/1024/1024).toFixed(1);
    if(parseFloat(mb)>20){if(!confirm("Файл "+mb+" MB. Продолжить?"))return;}
    s.trackData=e.target.result;s.trackName=file.name;
    saveTrackIDB(s.id,s.trackData,s.trackName);
    save();rPlayer(s);rLandscapePlayer(s);
  };
  reader.readAsDataURL(file);
}
function removeTrack(sid){
  var s=findR(sid);if(!s)return;
  if(!confirm(LANG==="en"?"Delete audio?":"Удалить аудио?"))return;
  if(audioObj){audioObj.pause();audioObj=null;}
  deleteTrackIDB(s.id);delete s.trackData;delete s.trackName;save();rPlayer(s);rLandscapePlayer(s);
}

var perfFontSz = 22;
var perfScrollOn = false;
var perfScrollTimer = null;

function enterPerfMode(){
  var s = findR(panel.id); if(!s) return;
  var ov = document.getElementById('perfOverlay');
  var body = document.getElementById('perfBody');
  var meta = document.getElementById('perfMeta');
  var keyInfo = document.getElementById('perfKeyInfo');
  meta.textContent = s.title + ' · ' + s.artist;
  keyInfo.textContent = s.key + ' · ' + s.tempo + ' BPM';
  body.innerHTML = '';
  perfFontSz = 22;
  var lines = (s.lyrics || '').split('\n');
  var currentSection = null;
  lines.forEach(function(line){
    if(line.startsWith('[') && /^\[[А-ЯA-Z]/.test(line)){
      currentSection = document.createElement('div');
      currentSection.className = 'perf-section';
      var lhd = document.createElement('div');
      lhd.className = 'perf-lhd';
      lhd.textContent = line.replace(/[\[\]]/g,'');
      currentSection.appendChild(lhd);
      body.appendChild(currentSection);
    } else if(line.trim()) {
      if(!currentSection){ currentSection = document.createElement('div'); currentSection.className='perf-section'; body.appendChild(currentSection); }
      var ln = document.createElement('div');
      ln.className = 'perf-line';
      ln.textContent = line;
      currentSection.appendChild(ln);
    }
  });
  if(!s.lyrics || !s.lyrics.trim()){
    body.innerHTML = '<div class="empty-state" style="padding:60px 20px;">'+(LANG==='en'?'No lyrics':'Нет текста')+'</div>';
  }
  ov.classList.add('open');
  body.scrollTop = 0;
  history.pushState({perf:true},"","");
  if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){});
}

function exitPerfMode(){
  stopPerfScroll();
  document.getElementById('perfOverlay').classList.remove('open');
}

function perfFontSize(d){
  perfFontSz = Math.max(14, Math.min(38, perfFontSz + d));
  document.querySelectorAll('.perf-line').forEach(function(el){ el.style.fontSize = perfFontSz + 'px'; });
}

var perfMetrOn=false;
var perfMetrInterval=null;
function togglePerfMetronome(){
  var btn=document.getElementById('perfMetrBtn');
  if(perfMetrOn){
    clearInterval(perfMetrInterval);perfMetrInterval=null;perfMetrOn=false;
    if(btn){btn.classList.remove('on');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px;"><polygon points="5 3 19 12 5 21 5 3"/></svg>Click';}
  } else {
    var s=findR(panel.id);
    var bpm=s?s.tempo:100;
    if(bpm<20)bpm=20;
    perfMetrOn=true;
    if(btn){btn.classList.add('on');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke-width="0" style="display:inline;vertical-align:middle;margin-right:4px;"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>Stop';}
    var beat=0;
    perfMetrInterval=setInterval(function(){
      playClick(beat%4===0);beat++;
    },60000/bpm);
  }
}
var perfScrollSpeed=0.5;

function perfScrollSpeedChange(d){
  perfScrollSpeed=Math.max(0.2,Math.min(10,Math.round((perfScrollSpeed+d*0.2)*10)/10));
  if(perfScrollOn){
    clearInterval(perfScrollTimer);perfScrollTimer=null;
    perfScrollTimer=setInterval(function(){
      var b=document.getElementById('perfBody');
      b.scrollTop+=perfScrollSpeed;
      if(b.scrollTop+b.clientHeight>=b.scrollHeight){stopPerfScroll();}
    },50);
  }
}

function togglePerfScroll(){
  perfScrollOn = !perfScrollOn;
  var btn = document.getElementById('perfScrollBtn');
  btn.classList.toggle('on', perfScrollOn);
  btn.innerHTML = perfScrollOn ? '■ STOP' : 'AUTO<br>SCROLL';
  if(perfScrollOn){
    perfScrollTimer = setInterval(function(){
      var b = document.getElementById('perfBody');
      b.scrollTop += perfScrollSpeed;
      if(b.scrollTop + b.clientHeight >= b.scrollHeight){ stopPerfScroll(); }
    }, 50);
  } else { stopPerfScroll(); }

function getMapSec(name){
  // match by id or name
  var sec=MAP_SECS.find(function(s){return s.id===name||s.name===name||s.enName===name;});
  if(sec)return sec;
  // fuzzy match
  var nl=name.toLowerCase();
  sec=MAP_SECS.find(function(s){return nl.includes(s.id)||s.name.toLowerCase().includes(nl)||nl.includes(s.name.toLowerCase());});
  return sec||{id:'other',name:name,enName:name,color:'#C8C8C8',cls:'mc-other'};
}

// IndexedDB for backing tracks
var trackDB=null;
function openTrackDB(cb){
  if(trackDB){cb(trackDB);return;}
  var req=indexedDB.open('bandlist_tracks',1);
  req.onupgradeneeded=function(e){e.target.result.createObjectStore('tracks');};
  req.onsuccess=function(e){trackDB=e.target.result;cb(trackDB);};
  req.onerror=function(){cb(null);};
}
function saveTrackIDB(songId,data,name){
  openTrackDB(function(db){
    if(!db)return;
    var tx=db.transaction('tracks','readwrite');
    tx.objectStore('tracks').put({data:data,name:name},String(songId));
  });
}
function loadTrackIDB(songId,cb){
  openTrackDB(function(db){
    if(!db){cb(null);return;}
    var tx=db.transaction('tracks','readonly');
    var req=tx.objectStore('tracks').get(String(songId));
    req.onsuccess=function(){cb(req.result||null);};
    req.onerror=function(){cb(null);};
  });
}
function deleteTrackIDB(songId){
  openTrackDB(function(db){
    if(!db)return;
    var tx=db.transaction('tracks','readwrite');
    tx.objectStore('tracks').delete(String(songId));
  });
}

function calcSectionTime(sec){
  // sum up duration of all songs in section
  // duration = bars / (tempo/4) * 60 seconds
  var totalSec=0;
  if(!sec.songs)return null;
  var hasData=false;
  sec.songs.forEach(function(sid){
    var s=findR(sid);
    if(!s)return;
    var bars=0;
    if(s.form&&s.form.length>0){
      s.form.forEach(function(f){bars+=f.b||4;});
    } else if(s.tempo) {
      // estimate ~3 min average if no form data
      return;
    }
    if(bars>0&&s.tempo>0){
      totalSec+=bars/(s.tempo/4)*60;
      hasData=true;
    }
  });
  if(!hasData)return null;
  var mins=Math.round(totalSec/60);
  return mins>0?'~ '+mins+' '+(LANG==='en'?'min':'мин'):null;
}



function filterSiteJunk(lines){
  var stopPatterns=[
    /^комментарий автора/i,
    /^аккорд\s+[A-Ga-g]/i,
    /^что обсуждают/i,
    /^ищу аккорды/i,
    /^лучшие подборы/i,
    /посмотреть все подборы/i,
    /^название композиции/i,
    /^\d+,\d+\s+\d+/,
  ];
  var junkPatterns=[
    /^https?:\/\//i,
    /войти|зарегистр|скачать|подписат|реклам|cookie|copyright|©/i,
    /app icon|google play|app store|telegram/i,
    /^[-=_*]{3,}$/,
    /^\s*\d+\s*$/,
    /наслаждайтесь|официальн|приложени/i,
    /прокрутка|тональность:|шрифт|форматирован/i,
    /аппликатур|популярные подборы/i,
    /закрыть|главная|AmDm|amdm/i,
    /подписывайтесь|наша группа|сохранить в/i,
    /нашли ошибку|редактировать|корректировать/i,
    /история действий|поделиться/i,
    /facebook|вконтакте|одноклассники|twitter/i,
    /^вст\.|^intro\s*:/i,
    /^[\d\s|\-]+$/,
    /и далее:|и дальше:/i,
    /аккорды для гитары|аккорды песни/i,
  ];
  var result=[];
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(!t) continue;
    var stop=false;
    for(var s=0;s<stopPatterns.length;s++){
      if(stopPatterns[s].test(t)){stop=true;break;}
    }
    if(stop) break;
    if(t.length>200) continue;
    var junk=false;
    for(var j=0;j<junkPatterns.length;j++){
      if(junkPatterns[j].test(t)){junk=true;break;}
    }
    if(!junk) result.push(lines[i]);
  }
  return result;
}

function isChordToken(w){
  return /^[A-Ga-g][#b]?(?:m|maj7?|min|dim|aug|sus[24]?|add\d?|\d)*(?:\/[A-Ga-g][#b]?)?$/.test(w);
}
function isChordLine(line){
  var trimmed=line.trim();
  if(!trimmed) return false;
  // Must start with a chord token (capital letter chord)
  if(!/^[A-Ga-g]/.test(trimmed)) return false;
  var words=trimmed.split(/\s+/).filter(function(w){return w.length>0;});
  if(!words.length) return false;
  // ALL words must be chord tokens
  var allChords=words.every(function(w){return isChordToken(w);});
  return allChords && words.length>=1;
}
function extractChordsFromLine(line){
  return line.trim().split(/\s+/).filter(function(w){return isChordToken(w);});
}

function parseChordProText(raw){
  var result={form:[],lyrics:'',chordBlocks:[],title:'',artist:''};
  var rawLines=raw.split('\n');

  // Detect title/artist
  for(var li=0;li<Math.min(rawLines.length,40);li++){
    var rl=rawLines[li].trim();
    var sepMatch=rl.match(/^(.+)\s+[—–]\s+(.+?)(?:,\s*(?:аккорды|chords|tabs|текст).*)?$/);
    if(!sepMatch){
      var lastDash=rl.lastIndexOf(' - ');
      if(lastDash>0){
        var a=rl.substring(0,lastDash).trim();
        var b=rl.substring(lastDash+3).trim().replace(/,.*$/,'').trim();
        if(a.length>=2&&b.length>=2) sepMatch=[rl,a,b];
      }
    }
    if(sepMatch&&sepMatch[1]&&sepMatch[2]&&sepMatch[1].length>=2&&sepMatch[1].length<60&&sepMatch[2].length>=2&&sepMatch[2].length<80){
      var hasAkkords=/аккорды|chords|tabs/i.test(rl);
      if(!/войти|главная|новинки|популярн|скачать|прокрутка|шрифт/i.test(rl)){
        if(hasAkkords||sepMatch[1].trim().length>=3){
          result.artist=sepMatch[1].trim();
          result.title=sepMatch[2].trim().replace(/,.*$/,'').trim();
          if(hasAkkords)break;
        }
      }
    }
  }

  var lines=filterSiteJunk(rawLines);
  var currentSection=null;
  var currentLyrics=[];
  var currentChords=[];
  var sectionMap={
    'куплет':'Куплет','verse':'Куплет','запев':'Куплет',
    'припев':'Припев','chorus':'Припев','refrain':'Припев',
    'бридж':'Бридж','bridge':'Бридж',
    'интро':'Интро','intro':'Интро','вступление':'Интро',
    'соло':'Соло','solo':'Соло',
    'проигрыш':'Проигрыш','break':'Проигрыш','сбивка':'Проигрыш',
    'аутро':'Аутро','outro':'Аутро','кода':'Кода','coda':'Кода',
    'пре-хорус':'Пре-хорус','pre':'Пре-хорус','pre-chorus':'Пре-хорус',
  };

  function matchSection(raw){
    var s=raw.toLowerCase().replace(/[:\s]+$/,'').trim();
    var matched=null;
    Object.keys(sectionMap).forEach(function(k){
      if(s===k||s.indexOf(k)===0) matched=sectionMap[k];
    });
    var numMatch=s.match(/^(.+?)\s+(\d+)$/);
    if(numMatch&&sectionMap[numMatch[1]]) matched=sectionMap[numMatch[1]]+' '+numMatch[2];
    return matched||raw;
  }

  function flushSection(){
    if(!currentSection)return;
    result.form.push({n:currentSection,b:4,notes:{}});
    var lyrText=currentLyrics.join('\n').trim();
    if(lyrText) result.lyrics+=(result.lyrics?'\n':'')+'['+currentSection+']\n'+lyrText;
    var allChords=[];
    currentChords.forEach(function(ch){
      if(allChords.indexOf(ch)<0)allChords.push(ch);
    });
    if(allChords.length) result.chordBlocks.push({name:currentSection,chords:allChords.join('  ')});
    currentSection=null;currentLyrics=[];currentChords=[];
  }

  // Merge amdm chord line + text line into [Am]text format
  function mergeChordLineWithText(chordLine, textLine){
    var chordPattern=/([A-Ga-g][#b]?(?:m|maj7?|min|dim|aug|sus[24]?|add\d|\d)*(?:\/[A-Ga-g][#b]?)?)/g;
    var chords=[];
    var m;
    while((m=chordPattern.exec(chordLine))!==null){
      chords.push({chord:m[1],pos:m.index});
    }
    if(!chords.length) return textLine;
    chords.forEach(function(c){
      if(currentChords.indexOf(c.chord)<0) currentChords.push(c.chord);
    });
    if(!textLine.trim()) return chords.map(function(c){return '['+c.chord+']';}).join(' ');
    chords.sort(function(a,b){return a.pos-b.pos;});

    // Find next word start at or after pos in text
    function nextWordStart(text, pos){
      pos=Math.min(pos, text.length);
      // If we're already at a non-space char, return pos
      if(pos<text.length && text[pos]!==' ') return pos;
      // Otherwise find next non-space
      while(pos<text.length && text[pos]===' ') pos++;
      return pos;
    }

    var text=textLine;
    // Build insertions at word boundaries
    var insertions=[];
    chords.forEach(function(c){
      var ws=nextWordStart(text, c.pos);
      insertions.push({at:ws, chord:c.chord});
    });
    insertions.sort(function(a,b){return a.at-b.at;});

    // Build output string
    var out='';
    var cursor=0;
    insertions.forEach(function(ins){
      var at=ins.at;
      if(at<cursor) at=cursor; // don't go backwards
      if(at>cursor) out+=text.slice(cursor,at);
      out+='['+ins.chord+']';
      cursor=at;
    });
    out+=text.slice(cursor);
    return out;
  }

  var i=0;
  while(i<lines.length){
    var line=lines[i];
    var trimmed=line.trim();
    if(!trimmed){i++;continue;}

    // Section header
    var secMatch=trimmed.match(/^\[([^\]]+)\]:?$/)
      ||trimmed.match(/^\|([^|]+)\|:?$/)
      ||trimmed.match(/^(куплет|припев|интро|вступление|проигрыш|бридж|соло|аутро|кода|пре-хорус|verse|chorus|intro|bridge|solo|outro|coda|pre)[\s:\d]*:?$/i);
    if(secMatch){
      flushSection();
      currentSection=matchSection(secMatch[1]||secMatch[0]);
      i++;continue;
    }

    if(!currentSection) currentSection='Куплет';

    // Skip tab lines
    if(/^[ebgdaEBGDA]--/.test(trimmed)||/^И далее:/.test(trimmed)){
      i++;continue;
    }

    // ChordPro inline: [Am]текст
    if(/\[[A-Ga-g][#b]?/.test(trimmed)&&!/^\[[А-ЯA-Z]/.test(trimmed)){
      var matches=trimmed.match(/\[([A-Ga-g][#b]?(?:m|maj7?|min|dim|aug|sus[24]?|add\d|\d)*(?:\/[A-Ga-g][#b]?)?)\]/g)||[];
      matches.forEach(function(m){var ch=m.replace(/[\[\]]/g,'');if(currentChords.indexOf(ch)<0)currentChords.push(ch);});
      currentLyrics.push(trimmed);
      i++;continue;
    }

    // AmDm format: one or more chord lines above text line
    if(isChordLine(trimmed)){
      // Collect all consecutive chord lines
      var j=i+1;
      while(j<lines.length){
        var jt=lines[j].trim();
        if(!jt){j++;continue;}
        if(isChordLine(jt)){j++;}
        else break;
      }
      // Extract all chords from these lines into chordBlocks
      for(var k=i;k<j;k++){
        extractChordsFromLine(lines[k].trim()).forEach(function(ch){
          if(currentChords.indexOf(ch)<0)currentChords.push(ch);
        });
      }
      // Next line is text - add it clean
      if(j<lines.length&&lines[j].trim()&&!/^[ebgdaEBGDA]--/.test(lines[j].trim())&&!/^И далее:/.test(lines[j].trim())){
        currentLyrics.push(lines[j].trim());
        i=j+1;
      } else {
        i=j;
      }
      continue;
    }

    currentLyrics.push(trimmed);
    i++;
  }
  flushSection();
  return result;
}

var globalWakeLock=null;
async function requestGlobalWakeLock(){
  if('wakeLock' in navigator){
    try{
      globalWakeLock=await navigator.wakeLock.request('screen');
      globalWakeLock.addEventListener('release',function(){
        // re-request if page is still visible
        if(document.visibilityState==='visible') requestGlobalWakeLock();
      });
    }catch(e){}
  }
}

});

      var newWorker = reg.installing;
      newWorker.addEventListener('statechange', function(){
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
          // New version available - reload automatically
          window.location.reload();
        }
      });
    });
  }).catch(function(){});
  // Check for updates every time page becomes visible
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      navigator.serviceWorker.getRegistration().then(function(reg){
        if(reg) reg.update();
      });
    }
  });
}

    history.pushState({live:true},'','');
  } else {
    if(btn){
      btn.style.background='transparent';
      btn.style.borderColor='rgba(255,255,255,0.8)';
      btn.querySelectorAll('span').forEach(function(s){s.style.color='rgba(255,255,255,0.9)';});
    }
    ov.classList.remove('open');
    document.getElementById('liveFullTab').classList.remove('open');
    Object.values(liveAudioObjs).forEach(function(a){if(a)a.pause();});
    liveAudioObjs={};
    liveActiveSongIdx=-1;
  }
}

function rLiveCards(){
  if(typeof D==='undefined')return;
  var con=D.concerts.find(function(c){return c.id===D.active;})||D.concerts[0];
  var titleEl=document.getElementById('liveConTitle');
  if(titleEl&&con)titleEl.textContent=con.name||'';
  var container=document.getElementById('liveCards');
  if(!container)return;
  container.innerHTML='';
  var secs=D.sections[D.active]||[];
  var songs=[];
  secs.forEach(function(sec){
    (sec.songs||[]).forEach(function(sid){var s=findR(sid);if(s)songs.push(s);});
  });
  // Загружаем треки из IDB для всех песен перед рендером
  var pending=songs.filter(function(s){return !s.trackData;});
  var loaded=0;
  if(pending.length===0){
    _renderLiveCards(songs);
    setTimeout(function(){setLiveSong(0);},50);
    return;
  }
  pending.forEach(function(s){
    loadTrackIDB(s.id,function(rec){
      if(rec){s.trackData=rec.data;s.trackName=rec.name;}
      loaded++;
      if(loaded===pending.length){
        _renderLiveCards(songs);
        setTimeout(function(){setLiveSong(0);},50);
      }
    });
  });
}

function _renderLiveCards(songs){
  var container=document.getElementById('liveCards');
  if(!container)return;
  container.innerHTML='';
  var svgPlay='<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><polygon points="3,2 16,9 3,16" fill="#D4793F"/></svg>';
  var svgStop='<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" fill="#D4793F"/></svg>';
  songs.forEach(function(s,i){
    var card=document.createElement('div');card.className='lc';
    (function(idx){
      card.addEventListener('click',function(e){
        if(e.target.closest('button')||e.target.closest('.lc-prog'))return;
        setLiveSong(idx);
      });
    })(i);
    var row=document.createElement('div');row.className='lc-row';
    var num=document.createElement('div');num.className='lc-num';num.textContent=i+1;
    var info=document.createElement('div');info.className='lc-info';
    info.innerHTML='<div class="lc-title">'+esc(s.title||'')+'</div><div class="lc-artist">'+esc(s.artist||'')+'</div>';
    var meta=document.createElement('div');meta.className='lc-meta';
    meta.innerHTML='<div class="lc-box"><div class="lc-box-lbl">key</div><div class="lc-box-val">'+esc(s.key||'—')+'</div></div>'
      +'<div class="lc-box"><div class="lc-box-lbl">bpm</div><div class="lc-box-val">'+(s.tempo||'—')+'</div></div>';
    row.appendChild(num);row.appendChild(info);row.appendChild(meta);
    card.appendChild(row);
    if(s.trackName&&s.trackData){
      var pw=document.createElement('div');pw.className='lc-player';
      var pb=document.createElement('button');pb.className='lc-play';pb.innerHTML=svgPlay;
      var pg=document.createElement('div');pg.className='lc-prog';
      var pf=document.createElement('div');pf.className='lc-prog-fill';pf.style.width='0%';
      var pd=document.createElement('div');pd.className='lc-prog-dot';
      pf.appendChild(pd);pg.appendChild(pf);
      var tm=document.createElement('div');tm.className='lc-time';tm.textContent='0:00';
      (function(sid,playBtn,progBar,fill,timeEl){
        if(!liveAudioObjs[sid]){
          var audio=new Audio(s.trackData);audio.volume=0.8;liveAudioObjs[sid]=audio;
          audio.ontimeupdate=function(){
            if(!audio.duration)return;
            fill.style.width=(audio.currentTime/audio.duration*100)+'%';
            var v=Math.floor(audio.currentTime);timeEl.textContent=Math.floor(v/60)+':'+(v%60<10?'0':'')+v%60;
          };
          audio.onended=function(){playBtn.innerHTML=svgPlay;fill.style.width='0%';timeEl.textContent='0:00';};
        }
        var ao=liveAudioObjs[sid];
        playBtn.addEventListener('click',function(){
          if(ao.paused){ao.play();playBtn.innerHTML=svgStop;}
          else{ao.pause();playBtn.innerHTML=svgPlay;}
        });
        progBar.addEventListener('click',function(e){
          if(!ao.duration)return;
          var r=progBar.getBoundingClientRect();
          ao.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*ao.duration;
        });
        progBar.addEventListener('touchend',function(e){
          e.preventDefault();
          if(!ao.duration)return;
          var r=progBar.getBoundingClientRect();
          var touch=e.changedTouches[0];
          ao.currentTime=Math.max(0,Math.min(1,(touch.clientX-r.left)/r.width))*ao.duration;
        },{passive:false});
      })(s.id,pb,pg,pf,tm);
      pw.appendChild(pb);pw.appendChild(pg);pw.appendChild(tm);
      card.appendChild(pw);
    } else {
      // Всегда показываем плеер — с кнопкой загрузки если нет трека
      var pw2=document.createElement('div');pw2.className='lc-player';
      var pb2=document.createElement('button');pb2.className='lc-play';pb2.innerHTML=svgPlay;pb2.style.opacity='0.3';pb2.disabled=true;
      var pg2=document.createElement('div');pg2.className='lc-prog';
      var pf2=document.createElement('div');pf2.className='lc-prog-fill';pf2.style.width='0%';pg2.appendChild(pf2);
      var noTrk=document.createElement('div');noTrk.style.cssText='font-size:10px;color:#555;font-family:Inter,sans-serif;flex-shrink:0;';
      noTrk.textContent=LANG==='en'?'no track':'нет трека';
      pw2.appendChild(pb2);pw2.appendChild(pg2);pw2.appendChild(noTrk);
      card.appendChild(pw2);
    }
    var dv=document.createElement('div');dv.className='lc-divider';card.appendChild(dv);
    var tabs=document.createElement('div');tabs.className='lc-tabs';
    [{id:'form',label:LANG==='en'?'FORM':'ФОРМА'},{id:'lyrics',label:LANG==='en'?'LYRICS':'ТЕКСТ'},{id:'chords',label:LANG==='en'?'CHORDS':'АККОРДЫ'},{id:'notes',label:LANG==='en'?'NOTES':'ЗАМЕТКИ'}]
    .forEach(function(t){
      var btn=document.createElement('button');btn.className='lc-tab';btn.textContent=t.label;
      (function(song,tabId){btn.addEventListener('click',function(){openLiveFullTab(song,tabId);});})(s,t.id);
      tabs.appendChild(btn);
    });
    card.appendChild(tabs);
    container.appendChild(card);
  });
} // end _renderLiveCards

function openLiveFullTab(s,tabId){
  var labels={form:LANG==='en'?'FORM':'ФОРМА',lyrics:LANG==='en'?'LYRICS':'ТЕКСТ',chords:LANG==='en'?'CHORDS':'АККОРДЫ',notes:LANG==='en'?'NOTES':'ЗАМЕТКИ'};
  document.getElementById('lftTitle').textContent=s.title||'';
  document.getElementById('lftTabLabel').textContent=labels[tabId]||tabId;
  document.getElementById('lftKey').textContent=s.key||'—';
  document.getElementById('lftBpm').textContent=s.tempo||'—';
  var content=document.getElementById('lftContent');
  content.innerHTML='';
  content.style.cssText='flex:1;overflow-y:auto;padding:24px 20px 40px;font-size:18px;line-height:1.8;color:#f0ece4;font-family:Golos Text,sans-serif;';
  if(tabId==='form'){
    var form=s.form||[];
    if(!form.length){
      content.innerHTML='<div class="empty-state">'+(LANG==='en'?'No form data':'Нет данных формы')+'</div>';
    } else {
      form.forEach(function(f){
        var d=document.createElement('div');
        d.style.cssText='padding:12px 16px;background:#1e1e26;border-radius:10px;margin-bottom:8px;font-size:16px;color:#f0ece4;font-weight:500;border-left:3px solid #D4793F;display:flex;align-items:center;justify-content:space-between;';
        var nameSpan=document.createElement('span');nameSpan.textContent=f.n||f.name||'';
        var barsSpan=document.createElement('span');barsSpan.style.cssText='font-size:11px;color:#555;font-family:Inter,sans-serif;';
        barsSpan.textContent=(f.b||f.bars||4)+' '+(LANG==='en'?'bars':'тактов');
        d.appendChild(nameSpan);d.appendChild(barsSpan);content.appendChild(d);
      });
    }
  } else if(tabId==='lyrics'){
    content.style.whiteSpace='pre-line';
    if(!s.lyrics){content.innerHTML='<div class="empty-state">'+(LANG==='en'?'No lyrics':'Нет текста')+'</div>';}
    else{content.textContent=s.lyrics;}
  } else if(tabId==='chords'){
    var blocks=s.chordBlocks||[];
    if(!blocks.length){
      content.innerHTML='<div class="empty-state">'+(LANG==='en'?'No chords':'Нет аккордов')+'</div>';
    } else {
      blocks.forEach(function(b){
        var sec=document.createElement('div');sec.style.marginBottom='16px';
        var secName=document.createElement('div');
        secName.style.cssText='font-size:10px;color:#D4793F;letter-spacing:2px;text-transform:uppercase;font-family:Inter,sans-serif;margin-bottom:6px;';
        secName.textContent=b.name||'';
        var chText=document.createElement('div');
        chText.style.cssText='font-size:20px;font-weight:700;letter-spacing:3px;color:#fff;white-space:pre-line;';
        chText.textContent=b.chords||'';
        sec.appendChild(secName);sec.appendChild(chText);content.appendChild(sec);
      });
    }
  } else if(tabId==='notes'){
    content.style.whiteSpace='pre-line';
    if(!s.notes){content.innerHTML='<div class="empty-state">'+(LANG==='en'?'No notes':'Нет заметок')+'</div>';}
    else{content.textContent=s.notes;}
  }
  document.getElementById('liveFullTab').classList.add('open');
  var backBtn=document.getElementById('lftBackBtn');
  if(backBtn)backBtn.textContent=LANG==='en'?'BACK':'НАЗАД';
  history.pushState({liveTab:true},'','');
}

var lftFontSz=18;
var lftScrollInterval=null;
var lftScrollOn=false;
var lftScrollSpeed=0.5;

function lftFontChange(d){
  lftFontSz=Math.max(14,Math.min(36,lftFontSz+d));
  var c=document.getElementById('lftContent');
  if(c)c.style.fontSize=lftFontSz+'px';
}

function lftScrollSpeedChange(d){
  lftScrollSpeed=Math.max(0.2,Math.min(10,Math.round((lftScrollSpeed+d*0.2)*10)/10));
  if(lftScrollOn){
    clearInterval(lftScrollInterval);
    lftScrollInterval=setInterval(function(){
      var c=document.getElementById('lftContent');if(c)c.scrollTop+=lftScrollSpeed;
    },50);
  }
}

function toggleLftScroll(){
  lftScrollOn=!lftScrollOn;
  var btn=document.getElementById('lftScrollBtn');
  if(lftScrollOn){
    if(btn){btn.classList.add('on');btn.innerHTML='■ STOP';}
    lftScrollInterval=setInterval(function(){
      var c=document.getElementById('lftContent');if(c)c.scrollTop+=lftScrollSpeed;
    },50);
  } else {
    clearInterval(lftScrollInterval);
    if(btn){btn.classList.remove('on');btn.innerHTML='AUTO<br>SCROLL';}
  }
}

function closeLiveFullTab(){
  document.getElementById('liveFullTab').classList.remove('open');
  clearInterval(lftScrollInterval);lftScrollOn=false;
  var sb=document.getElementById('lftScrollBtn');if(sb)sb.classList.remove('on');
}

window.addEventListener('popstate',function(){
  if(document.getElementById('liveFullTab').classList.contains('open')){closeLiveFullTab();return;}
  if(document.getElementById('liveOverlay').classList.contains('open')){toggleLiveMode();return;}
});
</script>

<script>
var undoStack=null;
var undoTimer=null;
function saveUndo(msg){undoStack=JSON.parse(JSON.stringify(D));}
function showUndoToast(msg){
  var toast=document.getElementById('undoToast');
  var msgEl=document.getElementById('undoToastMsg');
  var btn=document.getElementById('undoToastBtn');
  if(!toast)return;
  msgEl.textContent=msg;
  btn.textContent=LANG==='en'?'Undo':'Отменить';
  toast.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer=setTimeout(function(){toast.classList.remove('show');},5000);
}
function undoLast(){
  if(!undoStack)return;
  D=undoStack;undoStack=null;
  save();rConcerts();rList();
  document.getElementById('undoToast').classList.remove('show');
}
